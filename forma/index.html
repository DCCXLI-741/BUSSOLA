<style>

.ib.s{width:28px;height:28px;background:none;color:var(--acc)}.ib.s svg{width:22px;height:22px}

.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.fig{position:relative;height:170px;margin:10px 0 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

.qr{display:flex;flex-wrap:wrap;gap:6px}.qr button{border:1px solid var(--acc);background:none;color:var(--acc);border-radius:99px;padding:0 12px;min-height:36px;font:500 15px -apple-system,system-ui,sans-serif;cursor:pointer}

.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--gray);animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes bl{50%{opacity:.3}}
.media{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.media img,.media video{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--fill)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}.seg button{border:0;background:none;font:500 14px -apple-system,system-ui,sans-serif;color:var(--ink);padding:6px 4px;border-radius:7px;min-height:34px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}

<script>
{
/* ============ stato ============ */
const VER='2.0',DAYS=['lun','mar','mer','gio','ven','sab','dom'],DLONG=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'],DL=['L','M','M','G','V','S','D'],BYDAY=['MO','TU','WE','TH','FR','SA','SU'];
const KEY='forma1',KK='forma_key',MODEL='claude-sonnet-5-5';let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const DEF=()=>({v:2,ts:0,profile:null,onb:[],program:null,progStart:'',sessions:[],weights:[],coach:[],daily:{},active:null,set:{ora:'18:00',avviso:30},ui:{ex:'',rng:4,met:'n'}});
S=Object.assign(DEF(),S||{});S.set=Object.assign({ora:'18:00',avviso:30},S.set||{});S.ui=Object.assign({ex:'',rng:4,met:'n'},S.ui||{});S.daily=S.daily||{};
const IN_CLAUDE=!!(window.claude&&claude.use);

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let wq=0,writing=false;function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Memoria del telefono piena: elimina qualche foto')}if(ref){clearTimeout(wq);wq=setTimeout(push,800)}}
async function push(){if(!ref)return;if(writing){clearTimeout(wq);wq=setTimeout(push,600);return}writing=true;try{const X=JSON.parse(JSON.stringify(S));X.sessions=X.sessions.slice(-200);X.coach=X.coach.slice(-40);await ref.set(X)}catch(e){toast('Salvataggio online non riuscito: i dati restano qui')}writing=false}
(async()=>{try{if(!IN_CLAUDE)return;
 claude.use('sample').then(async s=>{SAMPLE=s;if(s){try{const l=await s.limits();AIimg=!!(l&&l.images)}catch(e){}}render()}).catch(()=>{});

function progCharts(){const T=stats(),M=S.ui.met,col={n:'var(--acc)',km:'var(--green)',sets:'var(--blue)'}[M],un={n:'allenamenti',km:'km',sets:'serie'}[M],goal={n:trainDays().length,km:planKm(),sets:0}[M];

 const exs=exData(),names=Object.keys(exs),sel=names.includes(S.ui.ex)?S.ui.ex:names[0],a=sel&&exs[sel];
 if(a&&a.length>1){const useKg=a.some(x=>x.kg>0);chart('chE',{vals:a.map(x=>useKg?x.kg+x.r/100:x.r),labels:a.map(x=>fdt(x.d)),color:'var(--acc)',label:'Progressi '+sel,tip:i=>`${fdt(a[i].d)}<br><b>${bestTxt(a[i])} reps</b>`})}

async function onbTurn(text){if(busy||!hasAI())return;if(text)S.onb.push({role:'user',content:text});busy=true;PEND=null;render();

async function coachTurn(text,images,thumb){if(busy||!hasAI())return;S.coach.push({role:'user',content:text,img:thumb||''});busy=true;PEND=null;render();
 const msgs=S.coach.slice(-14).map(m=>({role:m.role,content:m.content}));while(msgs.length&&msgs[0].role!=='user')msgs.shift();msgs[0]={role:'user',content:ctx()+'\n\n'+msgs[0].content};
 try{const o={cache:false,onText:({text})=>{PEND=text;const p=$('#pend');if(p)p.innerHTML=md(text)}};if(images&&images.length&&canImg())o.images=images;const r=await ask(msgs,o);S.coach.push({role:'assistant',content:r.text||PEND||''});busy=false;PEND=null;save();render()}catch(e){S.coach.pop();aiErr(e)}}

function startSession(i){const g=dayPlan(i);if(!g)return;
 S.active={id:uid(),d:iso(today()),day:i,titolo:g.titolo,tipo:g.tipo,t0:Date.now(),start:new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),note:'',media:[],
  esercizi:(g.esercizi||[]).map(e=>{const kg=String(e.carico||'').match(/-?\d+([.,]\d+)?/),r=String(e.reps||'').match(/\d+/);return{nome:e.nome,target:`${e.serie} × ${e.reps}${e.carico?' · '+e.carico:''}`,rec:+e.recupero_s||90,note:e.note||'',sets:Array.from({length:+e.serie||3},()=>({reps:r?r[0]:'',kg:kg?kg[0].replace(',','.'):'',ok:false}))}}),
  corsa:g.corsa?{tipo:g.corsa.tipo,obiettivo:[g.corsa.distanza_km&&g.corsa.distanza_km+' km',g.corsa.durata_min&&g.corsa.durata_min+' min',g.corsa.passo,g.corsa.descrizione].filter(Boolean).join(' · '),km:g.corsa.distanza_km||'',t:''}:null};
 S.ui.inSession=true;save();location.hash='#oggi';render();scrollTo(0,0)}
function startTimer(sec){clearInterval(tm);const end=Date.now()+sec*1000,el=$('#timer');const tick=()=>{const l=Math.max(0,Math.round((end-Date.now())/1000));el.innerHTML=`<div class="timer" role="timer"><b>${secTxt(l)}</b><div class="bar"><i style="width:${(1-l/sec)*100}%"></i></div><button data-act="tadd">+30 s</button><button data-act="tskip">${l?'Salta':'Via!'}</button></div>`;if(!l){clearInterval(tm);tm=null;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}setTimeout(()=>{if(!tm)el.innerHTML=''},2500)}};tick();tm=setInterval(tick,500);startTimer.end=end;startTimer.sec=sec}
async function finishSession(rpe,energy,pain,note){const A=S.active;A.rpe=rpe;A.energia=energy;A.dolori=pain;A.note=[A.note,note].filter(Boolean).join('\n');A.fine=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});A.min=A.t0?Math.round((Date.now()-A.t0)/6e4):null;if(A.corsa)A.corsa.sec=parseTime(A.corsa.t);
 const ses={...A};delete ses.day;S.sessions.push(ses);S.active=null;S.ui.inSession=false;S.ui.day=null;clearInterval(tm);tm=null;$('#timer').innerHTML='';save();render();
 if(!hasAI()){toast('Allenamento salvato');return}busy=true;openSh(shDebrief);
 const plan=dayPlan(A.day);const prompt=ctx()+`\n\nL’atleta ha appena finito questo allenamento.\nPIANO: ${JSON.stringify(plan)}\nESEGUITO: ${JSON.stringify({esercizi:A.esercizi.map(e=>({nome:e.nome,obiettivo:e.target,serie:e.sets})),corsa:A.corsa,minuti:A.min})}\nFATICA (RPE 1-10): ${rpe}; ENERGIA: ${energy}; DOLORI: ${pain||'nessuno'}; NOTE: ${A.note||'-'}\n\nDai un feedback da coach in 2-4 frasi brevi (cosa è andato bene, cosa migliorare, cosa fare prima della prossima seduta). Poi decidi gli aggiustamenti per le prossime sedute: se tutte le serie sono complete con fatica bassa aumenta carico o ripetizioni, se fallite o fatica molto alta mantieni o riduci; se c’è un dolore proponi una variante più sicura. Rispondi solo con JSON: {"feedback":"string","aggiornamenti":[{"esercizio":"nome esatto","serie":4,"reps":"6","carico":"+12,5 kg","note":"string"}],"corsa":{"distanza_km":7,"passo":"5:35/km","descrizione":"string"}}. Lascia vuoti gli array se non serve cambiare.`;
 try{const R=await askJSON(prompt,{modelTier:'default'});const s=S.sessions.find(x=>x.id===ses.id);s.feedback=R&&R.feedback||'Allenamento registrato.';const ch=[];
  (R&&R.aggiornamenti||[]).forEach(u=>S.program.giorni.forEach(g=>(g.esercizi||[]).forEach(e=>{if(e.nome.toLowerCase()===String(u.esercizio||'').toLowerCase()){const was=`${e.serie}×${e.reps} ${e.carico||''}`.trim();['serie','reps','carico','note'].forEach(k=>{if(u[k]!=null&&u[k]!=='')e[k]=u[k]});const now=`${e.serie}×${e.reps} ${e.carico||''}`.trim();if(was!==now&&!ch.some(c=>c.n===e.nome))ch.push({n:e.nome,was,now})}})));
  if(R&&R.corsa&&plan&&plan.corsa){const nx=S.program.giorni.find(g=>g.corsa&&g.tipo!=='riposo'&&g.corsa.tipo===plan.corsa.tipo);if(nx){const was=`${nx.corsa.distanza_km||''} km ${nx.corsa.passo||''}`;Object.assign(nx.corsa,Object.fromEntries(Object.entries(R.corsa).filter(([k,v])=>v!=null&&v!=='')));const now=`${nx.corsa.distanza_km||''} km ${nx.corsa.passo||''}`;if(was!==now)ch.push({n:'Corsa '+(nx.corsa.tipo||''),was,now})}}
  s.agg=ch.length;s.changes=ch;busy=false;save();render();openSh(shDebrief)}catch(e){busy=false;const s=S.sessions.find(x=>x.id===ses.id);s.feedback='';save();aiErr(e);closeSh()}}

async function compress(file,max,q=.82){const bmp=await createImageBitmap(file);const s=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',q))}
async function frames(file,n){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=URL.createObjectURL(file);await new Promise((r,j)=>{v.onloadeddata=r;v.onerror=j;setTimeout(j,15000)});const out=[];
 for(let k=1;k<=n;k++){v.currentTime=v.duration*k/(n+1);await new Promise(r=>{v.onseeked=r;setTimeout(r,3000)});const s=Math.min(1,768/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);c.getContext('2d').drawImage(v,0,0,c.width,c.height);out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.8)))}
 URL.revokeObjectURL(v.src);return out}
const dataURL=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});
async function handleMedia(file){const isV=file.type.startsWith('video');let url='',type=isV?'video':'image',imgs=[];toast(isV?'Preparo il video…':'Preparo la foto…');

 try{if(ASSETS){const up=await ASSETS.upload(isV&&file.size<20*1048576?file:imgs[0]);url=up.url}}catch(e){}
 if(!url){url=await dataURL(await compress(imgs[0],360,.7));type='image'}
 if(mediaTarget==='session'){S.active.media.push({url,type});save();render();if(hasAI()&&canImg())openSh(()=>shMediaAsk(imgs,isV))}
 else{const t=($('#msg')||{}).value||'';if($('#msg'))$('#msg').value='';coachTurn((t||(isV?'Guarda il mio video e dimmi come va la tecnica.':'Guarda questa foto.'))+(isV?' (Ti mando 4 fotogrammi del video.)':''),imgs,url)}}
let MEDIA_IMGS=null;const shMediaAsk=(imgs,isV)=>{MEDIA_IMGS=imgs;const ex=S.active.esercizi.map(e=>e.nome).concat(S.active.corsa?['Corsa']:[]);return nb2('Chiedi al coach','mediago')+`<p class="hint" style="margin:0 16px 10px">${isV?'Il coach guarda 4 fotogrammi del video.':'Il coach guarda la foto.'}</p><div class="list"><div class="f"><label for="m-ex">Esercizio</label><select id="m-ex">${ex.map(x=>`<option>${esc(x)}</option>`).join('')}<option>Altro</option></select></div></div><textarea class="note" id="m-q" style="margin-top:10px" placeholder="Es. la schiena è dritta?"></textarea>`};

 ${N.acqua_l?`<p class="hint">Acqua: circa ${it(num(N.acqua_l))} litri al giorno.</p>`:''}<p class="hint">Stime per una persona sana: con condizioni particolari senti un medico o un nutrizionista.</p>`};
const shWk=()=>{const R=weekRings(),ss=S.sessions.filter(s=>inWeek(s,0));return nbF('Questa settimana')+`<div class="list hero"><button class="rings" style="cursor:default">${R.html}<div class="leg"><div><small style="color:var(--acc)">Allenamenti</small><b>${R.done}<span>/${R.td}</span></b></div><div><small style="color:var(--green)">Corsa</small><b>${it(R.km)}<span>/${it(R.pk)} km</span></b></div><div><small style="color:var(--cyan)">Acqua oggi</small><b>${it(R.w/1000)}<span>/${it(R.wt/1000)} l</span></b></div></div></button></div>
 <h2>Sedute fatte</h2><div class="list">${ss.map(sRow).join('')||'<p class="mut" style="padding:14px 16px">Ancora nessuna. Si parte!</p>'}</div>`};
const shFb=()=>{const s=[...S.sessions].reverse().find(x=>x.feedback);return nbF('Il coach')+`<p class="hint" style="margin:0 16px 8px">${esc(s.titolo)} · ${fdt(s.d)}</p><div class="list hero"><p class="txt">${md(s.feedback)}</p></div>${(s.changes||[]).length?`<h2>Cambiato nel programma</h2><div class="list">${s.changes.map(c=>`<div class="row"><span class="t">${esc(c.n)}<small>${esc(c.was)}</small></span><span class="v"><b style="color:var(--green)">${esc(c.now)}</b></span></div>`).join('')}</div>`:''}<button class="btn sec" data-act="gocoach">Rispondi al coach</button>`};
const shHist=()=>nbF('Storico')+`<div class="list">${[...S.sessions].reverse().map(sRow).join('')}</div>`;
const shGcal=()=>nbF('Google Calendar')+`<div class="list">${DAYS.map((x,k)=>{const g=dayPlan(k);return g&&g.tipo!=='riposo'?`<a class="row chev" target="_blank" rel="noopener" href="${gcal(k,g)}"><span class="t">${DLONG[k]}<small>${esc(g.titolo)} · ogni settimana alle ${esc(S.set.ora)}</small></span><span class="v" style="color:var(--acc)">Aggiungi</span></a>`:''}).join('')}</div><p class="hint">Un evento ricorrente per ogni giorno di allenamento.</p>`;
const shIcsHelp=()=>nbF('Calendario iPhone')+`<div class="list hero"><p class="txt">Se si è aperto il Calendario, tocca <b>Aggiungi tutti</b>: avrai ${trainDays().length} allenamenti ricorrenti alle ${esc(S.set.ora)}${+S.set.avviso?` con avviso ${S.set.avviso} minuti prima`:''}.</p></div><p class="hint">Non si è aperto? Condividi il file e scegli Calendario, oppure salvalo in File e aprilo da lì.</p><button class="btn" data-act="icsshare">Condividi il file del calendario</button><p class="hint">Se cambi programma o orario, ripeti: gli eventi vengono aggiornati.</p>`;
const shIcsClaude=()=>nbF('Calendario iPhone')+`<div class="list hero"><p class="txt">Dentro Claude il Calendario di iPhone non si può aprire. Usa <b>Google Calendar</b> qui, oppure l’app Forma installata sul telefono, che aggiunge gli allenamenti al Calendario con un tocco.</p></div><button class="btn" data-act="gcal">Google Calendar</button>`;
function shSess(id){return()=>{const s=S.sessions.find(x=>x.id===id);if(!s)return nbF('');return nbF(esc(s.titolo))+`<p class="hint" style="margin:0 16px 10px">${fdt(s.d)} · ${s.start||''}${s.fine?'–'+s.fine:''}</p>
 <div class="kpi" style="margin-bottom:10px"><div><small>Serie</small><b>${sesSets(s)}</b></div><div><small>${sesKm(s)?'Km':'Durata'}</small><b>${sesKm(s)?it(sesKm(s)):(s.min??'—')+'′'}</b></div><div><small>Fatica</small><b>${s.rpe||'—'}/10</b></div></div>
 <div class="list">${(s.esercizi||[]).map(e=>`<div class="ex"><h3>${esc(e.nome)}</h3><p class="note">${e.sets.filter(x=>x.ok).map(x=>`${x.reps||'?'}${x.kg?' @ '+x.kg+' kg':''}`).join(' · ')||'nessuna serie'}</p></div>`).join('')}${sesKm(s)?`<div class="ex"><h3>Corsa</h3><p class="note">${it(sesKm(s))} km · ${s.corsa.t||''} · ${pace(sesKm(s),parseTime(s.corsa.t))}</p></div>`:''}</div>
 ${s.note?`<h2>Sensazioni</h2><div class="list hero"><p style="font-size:15px">${esc(s.note)}</p></div>`:''}${(s.media||[]).length?`<div class="media">${s.media.map(m=>m.type==='video'?`<video src="${esc(m.url)}" controls playsinline></video>`:`<img src="${esc(m.url)}" alt="">`).join('')}</div>`:''}
 ${s.feedback?`<h2>Il coach</h2><div class="list hero"><p style="font-size:15px">${md(s.feedback)}</p></div>`:''}<button class="btn del" data-act="delsess" data-id="${s.id}">Elimina allenamento</button>`}}
function shSet(){const k=getKey();return nbF('Impostazioni')+`<h2 style="margin-top:4px">Intelligenza artificiale</h2>${IN_CLAUDE?`<div class="list"><div class="row"><span class="t">Coach collegato a Claude</span><span class="v ok">${SAMPLE?'✓ Attivo':'…'}</span></div></div>`:
 `<div class="list"><div class="f"><label for="apik">Chiave API</label><input id="apik" type="password" autocomplete="off" placeholder="sk-ant-…" value="${esc(k)}"></div></div>
 <div class="two" style="margin-top:8px"><button class="btn" data-act="savekey" style="margin:0">Salva e prova</button>${k?'<button class="btn del" data-act="delkey" style="margin:0">Rimuovi</button>':'<a class="btn sec" style="margin:0" href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Crea chiave</a>'}</div>
 <p class="hint" id="keyst">${KEYMSG?KEYMSG:k?'Chiave salvata solo su questo telefono.':'Crea un account su console.anthropic.com, carica un piccolo credito, imposta un limite di spesa e crea una chiave. Resta solo su questo telefono.'}</p>`}
 <h2>Dati</h2><div class="list"><button class="row chev" data-act="export"><span class="t">Esporta backup<small>per spostare i dati o conservarli</small></span></button><button class="row chev" data-act="imp"><span class="t">Importa backup<small>sostituisce i dati attuali</small></span></button>
 <button class="row chev" data-act="editprof"><span class="t">Rifai il colloquio iniziale<small>se cambiano obiettivi o abitudini</small></span></button></div>
 <p class="hint">${ref?'Dati salvati nel tuo account Claude, visibili solo a te.':'Dati salvati solo su questo telefono.'} Il coach usa l’intelligenza artificiale di Claude: può sbagliare e non sostituisce medico, fisioterapista o nutrizionista.</p><p class="hint">Forma ${VER}</p>`}
const shImp=()=>{const X=IMP;return nb2('Importa backup','doimp','Importa')+`<div class="list hero"><p class="txt">${X.profile?'<b>'+esc(X.profile.nome||'Atleta')+'</b> · ':''}${(X.sessions||[]).length} allenamenti · ${(X.weights||[]).length} pesate${X.program?' · programma “'+esc(X.program.nome||'')+'”':''}</p></div><p class="hint">I dati attuali su questo telefono verranno sostituiti.</p>`};
/* ============ azioni ============ */
function addDaily(k,v,label,unit){const D=dayData();D[k]+=v;save();render();toast(`${label}: ${k==='acqua'?it(D[k]/1000,2)+' l':D[k]+' g'}`,()=>{D[k]=Math.max(0,D[k]-v);save();render()})}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,g=s=>(($(s)||{}).value??'').trim();
 const O={close:closeSh,settings:()=>{KEYMSG='';openSh(shSet)},weight:()=>openSh(shWeight),dayd:()=>openSh(shDay(+b.dataset.i)),regen:()=>openSh(shRegen),sess:()=>openSh(shSess(id)),
  wkinfo:()=>openSh(shWk),lastfb:()=>openSh(shFb),allhist:()=>openSh(shHist),proginfo:()=>openSh(shProgInfo),nutinfo:()=>openSh(shNutInfo),gcal:()=>openSh(shGcal),ics:openIcs,icsshare:shareIcs,
  gocoach:()=>{closeSh();location.hash='#coach'},water:()=>addDaily('acqua',250,'Acqua'),prot:()=>addDaily('prot',25,'Proteine'),
  avv:()=>{S.set.avviso=+b.dataset.v;save();render()},rng:()=>{S.ui.rng=b.dataset.v==='all'?'all':+b.dataset.v;save();render()},met:()=>{S.ui.met=b.dataset.v;save();render()},exsel:()=>{S.ui.ex=b.dataset.v;save();render()},
  onbstart:()=>{S.onb=[{role:'user',content:'Ciao, voglio iniziare.'}];onbTurn()},onbsend:()=>{const t=g('#msg');if(t)onbTurn(t)},qr:()=>{if(!S.profile)onbTurn(b.dataset.q)},
  gen:()=>genProgram(),csend:()=>{const t=g('#msg');if(t)coachTurn(t)},cq:()=>coachTurn(b.dataset.q),
  day:()=>{S.ui.day=+b.dataset.i===dow(today())?null:+b.dataset.i;render()},start:()=>startSession(S.ui.day??dow(today())),startd:()=>{closeSh();startSession(+b.dataset.i)},resume:()=>{S.ui.inSession=true;render();scrollTo(0,0)},
  setok:()=>{const[ei,si]=b.dataset.i.split('.').map(Number),st=S.active.esercizi[ei].sets[si];st.ok=!st.ok;save();render();if(st.ok){try{navigator.vibrate&&navigator.vibrate(30)}catch(x){}startTimer(S.active.esercizi[ei].rec)}},
  addset:()=>{const ex=S.active.esercizi[+b.dataset.i],l=ex.sets[ex.sets.length-1]||{};ex.sets.push({reps:l.reps||'',kg:l.kg||'',ok:false});save();render()},
  tskip:()=>{clearInterval(tm);tm=null;$('#timer').innerHTML=''},tadd:()=>{const l=Math.max(0,Math.round((startTimer.end-Date.now())/1000));startTimer(l+30)},
  finish:()=>{S.active.note=g('#snote');save();openSh(shFinish)},abort:()=>{if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Conferma';return}S.active=null;S.ui.inSession=false;clearInterval(tm);tm=null;$('#timer').innerHTML='';save();render()},
  en:()=>b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)),
  painc:()=>{const all=[...b.parentNode.querySelectorAll('button')],none=all[0];if(b===none)all.forEach(x=>x.setAttribute('aria-pressed',x===none));else{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');none.setAttribute('aria-pressed',!all.slice(1).some(x=>x.getAttribute('aria-pressed')==='true'))}},
  fin:()=>{const r=+g('#rpe'),en=($('#en [aria-pressed=true]')||{}).dataset?.v||'Normale',zones=[...document.querySelectorAll('#painq [aria-pressed=true]')].map(x=>x.dataset.v).filter(x=>x!=='Nessuno'),p=[zones.join(', '),g('#pain')].filter(Boolean).join(': '),n=g('#fnote');closeSh();finishSession(r,en,p,n)},
  askex:()=>{const ex=S.active.esercizi[+b.dataset.i];S.active.note=g('#snote');save();location.hash='#coach';S.ui.inSession=true;setTimeout(()=>{const m=$('#msg');if(m){m.value=`Durante ${ex.nome}: `;m.focus()}},60)},
  media:()=>{if(!hasAI()&&b.dataset.for==='coach'){toast(ERR.no_key);return}mediaTarget=b.dataset.for;if(mediaTarget==='session')S.active.note=g('#snote');$('#mediaIn').click()},
  mediago:()=>{const ex=g('#m-ex'),q=g('#m-q');closeSh();location.hash='#coach';coachTurn(`[${ex}] ${q||'Come va la tecnica?'}`,MEDIA_IMGS,S.active&&S.active.media.length?S.active.media[S.active.media.length-1].url:'')},
  sweight:()=>{const k=num(g('#w-kg'));if(!k){toast('Scrivi il peso');return}S.weights=S.weights.filter(w=>w.d!==iso(today()));S.weights.push({d:iso(today()),kg:k});save();closeSh();render();toast('Peso salvato')},
  rgc:()=>{const t=$('#rg');t.value=(t.value?t.value+', ':'')+b.dataset.v.toLowerCase()},
  doregen:()=>{const t=g('#rg');closeSh();location.hash='#oggi';genProgram(t)},delsess:()=>{if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Tocca di nuovo per eliminare';return}S.sessions=S.sessions.filter(x=>x.id!==id);save();closeSh();render()},
  editprof:()=>{closeSh();S.profile=null;S.onb=[];save();location.hash='#oggi';render()},
  savekey:async()=>{const k=g('#apik');if(!/^sk-ant-/.test(k)){$('#keyst').textContent='La chiave inizia con sk-ant-';return}try{localStorage.setItem(KK,k)}catch(x){}$('#keyst').textContent='Provo la chiave…';
   try{await apiCall('Rispondi solo: ok',{max:5});KEYMSG='<span class="ok">✓ Funziona.</span> Chiave salvata solo su questo telefono.';render()}catch(x){$('#keyst').textContent=ERR[x&&x.code]||'Non funziona: controlla la chiave e il credito'}},
  delkey:()=>{try{localStorage.removeItem(KK)}catch(x){}openSh(shSet);render()},
  export:async()=>{const data=JSON.stringify(S),name='forma-backup-'+iso(today())+'.json';try{if(IN_CLAUDE){const dl=await claude.use('downloads');if(!dl){toast('Download non disponibile qui');return}await dl.save({filename:name,data});toast('Backup scaricato');return}
   const f=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Backup Forma'});return}dlBlob(f,name)}catch(err){if(err&&err.name!=='AbortError')toast('Esportazione non riuscita')}},
  imp:()=>$('#impIn').click(),
  doimp:()=>{S=Object.assign(DEF(),IMP);S.set=Object.assign({ora:'18:00',avviso:30},S.set||{});S.ui=Object.assign({ex:'',rng:4,met:'n'},S.ui||{});S.daily=S.daily||{};S.active=null;IMP=null;save();closeSh();location.hash='#oggi';render();toast('Dati importati')}};
 if(O[a])O[a]()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.set){const[ei,si,k]=t.dataset.set.split('.');S.active.esercizi[+ei].sets[+si][k]=t.value;save()}
 else if(t.dataset.run){S.active.corsa[t.dataset.run]=t.value;const p=$('#c-p');if(p)p.textContent=pace(num(S.active.corsa.km),parseTime(S.active.corsa.t))||'—';save()}
 else if(t.id==='rpe')$('#rpev').textContent=t.value+'/10';else if(t.id==='snote'&&S.active){S.active.note=t.value;save()}else if(t.id==='msg'){t.style.height='auto';t.style.height=Math.min(120,t.scrollHeight)+'px'}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='mediaIn'&&t.files[0]){handleMedia(t.files[0]);t.value=''}else if(t.id==='ora'&&t.value){S.set.ora=t.value;save()}
 else if(t.id==='impIn'&&t.files[0]){const f=t.files[0];t.value='';f.text().then(x=>{const X=JSON.parse(x);if(!X||!Array.isArray(X.sessions))throw 0;IMP=X;openSh(shImp)}).catch(()=>toast('File non valido'))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSh();if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='msg'){e.preventDefault();($('[data-act=onbsend]')||$('[data-act=csend]')).click()}});
addEventListener('hashchange',()=>{if(location.hash!=='#oggi'&&location.hash!=='#coach')S.ui.inSession=false;scrollTo(0,0);render()});
render();
if(!IN_CLAUDE&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
