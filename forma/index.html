<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forma</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forma">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<style>
/* VOICE: un coach vero: diretto, incoraggiante, poche parole, numeri chiari
   IDEA: la giornata a colpo d'occhio, come Calendario e Attività di iPhone insieme: tocchi e si apre
   PICTURE: gli anelli della settimana, la seduta di oggi con un solo pulsante, il mese con i pallini degli allenamenti
   COLOUR+TYPE: colori di sistema iOS, accento rosso-rosa degli anelli; font di sistema
   LAYOUT: titoli grandi, card raggruppate, quattro schede in basso, fogli dal basso, sezioni che si espandono */
:root{color-scheme:light dark;--bg:light-dark(#f2f2f7,#000);--card:light-dark(#fff,#1c1c1e);--ink:light-dark(#000,#fff);--mut:light-dark(#6c6c70,#98989f);
--sep:light-dark(rgba(60,60,67,.18),rgba(84,84,88,.6));--fill:light-dark(#e5e5ea,#2c2c2e);--acc:light-dark(#ff2d55,#ff375f);--blue:light-dark(#007aff,#0a84ff);--cyan:light-dark(#32ade6,#64d2ff);--green:light-dark(#34c759,#30d158);--orange:light-dark(#ff9500,#ff9f0a);--purple:light-dark(#af52de,#bf5af2);--red:light-dark(#ff3b30,#ff453a);--gray:light-dark(#aeaeb2,#636366);--bar:light-dark(rgba(249,249,249,.88),rgba(22,22,24,.88))}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow-x:clip;-webkit-font-smoothing:antialiased}
p{margin:0}.mut{color:var(--mut)}small{font-size:13px}button{font-family:inherit}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 110px}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lnk{background:none;border:0;color:var(--acc);font:400 17px -apple-system,system-ui,sans-serif;cursor:pointer;padding:0;min-height:36px}
h1{font-size:34px;font-weight:700;letter-spacing:.2px;margin:0 0 14px;line-height:1.1}h1 small{display:block;font-size:15px;font-weight:600;color:var(--acc);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
h2{font-size:20px;font-weight:700;margin:26px 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}h2 small{font-weight:400;color:var(--mut);font-size:15px}h3{font-size:17px;font-weight:600;margin:0}
.card,.list{background:var(--card);border-radius:16px;overflow:hidden}.hero{padding:16px}.card{padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:50px;position:relative;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:none}
.row+.row::before,.acc+.acc::before,.row+.acc::before,.acc+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .t{flex:1}.row .t small{display:block;color:var(--mut);margin-top:1px}.row .v{text-align:right;white-space:nowrap;color:var(--mut)}.row .v b{color:var(--ink);font-weight:600}
.chev::after{content:"";width:8px;height:8px;border:solid var(--gray);border-width:2px 2px 0 0;transform:rotate(45deg);flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--gray))}.bar4{width:4px;align-self:stretch;border-radius:2px;background:var(--c,var(--gray));flex:none}
.sub{font-size:15px;color:var(--mut);margin-top:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--acc);color:#fff;border:0;border-radius:14px;font:600 17px -apple-system,system-ui,sans-serif;min-height:52px;cursor:pointer;margin-top:12px;padding:0 16px;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}.btn.sec{background:var(--card);color:var(--acc)}.btn.gray{background:var(--fill);color:var(--ink)}.btn.del{background:var(--card);color:var(--red)}.btn:disabled{opacity:.5}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two .btn{margin-top:0}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;color:#fff;display:inline-block;text-transform:capitalize;background:var(--c,var(--gray))}
.c-forza{--c:var(--acc)}.c-corsa{--c:var(--blue)}.c-misto{--c:var(--purple)}.c-riposo{--c:var(--gray)}.c-mobilita{--c:var(--green)}
.ok{color:var(--green);font-weight:600}
/* anelli */
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.ch b{font-size:17px}.ch small{color:var(--mut)}
.rings{background:none;padding:0;display:grid;grid-template-columns:128px 1fr;gap:18px;align-items:center;width:100%;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.rings svg{width:128px;height:128px}.leg{display:grid;gap:8px}.leg div{display:grid}.leg small{font-weight:600;font-size:13px}.leg b{font-size:22px;font-weight:700;line-height:1.1}.leg b span{font-size:15px;color:var(--mut);font-weight:500}
/* seduta in evidenza */
.wc{position:relative}.wc .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.wc .hd small{color:var(--mut);font-weight:600}
.wc h3.big{font-size:24px;font-weight:700;margin:8px 0 10px;line-height:1.15}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:8px}.mini span{display:grid}.mini b{font-size:20px;font-weight:700}.mini small{color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chips span,.chips button{background:var(--fill);border-radius:99px;padding:5px 10px;font-size:13px;font-weight:500;border:0;color:var(--ink)}
.chips button{cursor:pointer;min-height:34px}.chips button[aria-pressed=true]{background:var(--acc);color:#fff}
.chips.sel{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.chips.sel button{white-space:nowrap}
.nx{display:flex;gap:12px;align-items:center}
/* sezioni espandibili */
.acc{position:relative}.acch{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;padding:0}
.acch .t{flex:1}.acch .t small{display:block;color:var(--mut)}
.more{width:26px;height:26px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none;transition:transform .3s}.more::after{content:"";width:7px;height:7px;border:solid var(--mut);border-width:0 2px 2px 0;transform:translateY(-2px) rotate(45deg)}
.acc.open .more{transform:rotate(180deg)}
.accb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1)}.acc.open .accb{grid-template-rows:1fr}.accb>div{overflow:hidden}
.exl{margin-top:12px;border-top:.5px solid var(--sep)}.exl>div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:.5px solid var(--sep);font-size:15px}.exl>div:last-child{border-bottom:0}.exl b{white-space:nowrap;font-weight:600}.exl small{display:block;color:var(--mut)}
.list .acc{padding:12px 16px}
/* calendario */
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.calh b{font-size:22px;font-weight:700;color:var(--acc)}.calh b span{color:var(--ink)}.calh div{display:flex;gap:6px}
.calh .ib{width:34px;height:34px;background:none;color:var(--acc)}.calh .ib svg{width:22px;height:22px}
.cdw,.cgrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.cdw span{font-size:12px;font-weight:600;color:var(--mut);padding:4px 0}
.cgrid{row-gap:2px;touch-action:pan-y}.cd{border:0;background:none;padding:3px 0 4px;display:grid;justify-items:center;gap:2px;cursor:pointer;color:var(--ink);font:inherit}
.cd b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:400;transition:background .2s,color .2s}
.cd i{width:6px;height:6px;border-radius:50%;background:transparent}.cd.plan i{box-shadow:inset 0 0 0 1.5px var(--c)}.cd.done i{background:var(--c)}.cd.miss i{box-shadow:inset 0 0 0 1.5px var(--gray)}
.cd.past b{color:var(--mut)}.cd.done b{color:var(--ink);font-weight:600}.cd.td b{background:var(--acc);color:#fff;font-weight:700}.cd.sel b{background:var(--ink);color:var(--card);font-weight:600}.cd.td.sel b{background:var(--acc);color:#fff}
.cgrid.sl{animation:sl .32s cubic-bezier(.2,.8,.2,1) both}@keyframes sl{from{opacity:0;transform:translateX(var(--dx,30px))}}
.dpan{border-top:.5px solid var(--sep);margin:10px -16px -16px;padding:12px 16px 14px;background:light-dark(#fafafc,#232326)}.dpan>small{display:block;color:var(--mut);font-weight:600;text-transform:capitalize;margin-bottom:8px}
.ev{display:flex;gap:10px;align-items:stretch}.ev .t{flex:1}.ev .t b{font-weight:600}.ev .t small{display:block;color:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}.legend i.o{background:none;box-shadow:inset 0 0 0 1.5px var(--c)}
/* obiettivi del giorno */
.tg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:center}
.tg span{display:grid;gap:1px;padding:10px 2px;border-radius:12px;background:var(--fill)}.tg b{font-size:17px;font-weight:700;color:var(--c,var(--ink))}.tg small{font-size:11px;color:var(--mut);font-weight:500}
.coachline{display:flex;gap:12px;align-items:center;width:100%;border:0;background:var(--card);border-radius:16px;padding:12px 14px;font:inherit;color:inherit;text-align:left;cursor:pointer;margin-top:12px}
.coachline svg{width:36px;height:36px;flex:none}.coachline p{font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.coachline small{color:var(--mut);display:block}
.banner{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:inset 0 0 0 1.5px var(--orange)}.banner p{flex:1;font-size:15px}.banner .btn{width:auto;margin:0;min-height:38px;font-size:15px;background:var(--orange)}
/* seduta */
.shead{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0 10px;margin:0 0 8px}
.shead .r{display:flex;justify-content:space-between;align-items:baseline}.shead b{font-size:22px;font-weight:700}.shead .tm{font-size:22px;font-weight:700;color:var(--acc)}
.pb{height:8px;background:var(--fill);border-radius:4px;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:var(--c,var(--acc));border-radius:4px;transition:width .4s}
.ex{padding:14px 16px}.ex+.ex{border-top:.5px solid var(--sep)}.ex h3{display:flex;justify-content:space-between;align-items:center;gap:8px}.ex .note{font-size:13px;color:var(--mut);margin-top:2px}
.sets{display:grid;grid-template-columns:24px 1fr 1fr 44px;gap:6px 8px;align-items:center;margin-top:10px}.sets .h{font-size:12px;color:var(--mut);font-weight:600}
.sets input{width:100%;font:17px -apple-system,system-ui,sans-serif;text-align:center;border:0;background:var(--fill);border-radius:8px;min-height:40px;color:var(--ink);padding:0 4px}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid var(--gray);background:none;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:18px;padding:0}.chk.on{background:var(--green);border-color:var(--green)}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{40%{transform:scale(1.25)}}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));width:min(448px,calc(100% - 32px));background:var(--ink);color:var(--card);border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tup .3s cubic-bezier(.2,.8,.2,1)}@keyframes tup{from{transform:translate(-50%,30px);opacity:0}}
.timer b{font-size:28px;font-weight:700;min-width:66px}.timer .bar{flex:1;height:6px;background:rgba(127,127,127,.35);border-radius:3px;overflow:hidden}.timer .bar i{display:block;height:100%;background:var(--acc)}.timer button{background:none;border:0;color:var(--card);font:600 15px -apple-system,system-ui,sans-serif;cursor:pointer;min-height:44px;padding:0 6px}
/* statistiche */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi button,.kpi div{background:var(--card);border-radius:14px;padding:12px;border:0;text-align:left;font:inherit;color:inherit;display:grid;gap:1px;align-content:start}
.kpi button{cursor:pointer}.kpi button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--c,var(--acc))}.kpi small{color:var(--mut);font-size:12px;font-weight:500}.kpi b{font-size:24px;font-weight:700;line-height:1.15;color:var(--c,var(--ink))}.kpi .u{font-size:12px;color:var(--mut)}
.heat{display:grid;grid-template-columns:16px repeat(12,1fr);gap:4px;align-items:center}.heat span{font-size:10px;color:var(--mut);font-weight:600}
.heat button{aspect-ratio:1;border-radius:4px;border:0;background:var(--fill);padding:0;cursor:default}.heat button.on{background:var(--c);cursor:pointer}.heat button.fut{opacity:.35}.heat button.now{outline:1.5px solid var(--ink);outline-offset:1px}
.fig{position:relative;height:170px;margin:10px 0 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tip{position:absolute;top:-6px;background:var(--card);border:.5px solid var(--sep);box-shadow:0 4px 16px rgba(0,0,0,.14);border-radius:10px;padding:6px 10px;font-size:13px;pointer-events:none;white-space:nowrap;z-index:2}
.pr{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}.pr b{font-size:28px;font-weight:700}
.medal{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:light-dark(#fff4d6,#3a2f10);color:var(--orange);font-size:15px;flex:none}
/* profilo */
.prof{display:flex;gap:14px;align-items:center}.av{width:64px;height:64px;flex:none}.prof b{font-size:22px;font-weight:700;display:block}
.wk{display:grid;grid-auto-flow:column;gap:4px;margin-top:10px}.wk i{height:6px;border-radius:3px;background:var(--fill)}.wk i.on{background:var(--acc)}
.donut{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}.donut svg{width:120px;height:120px}.donut .leg b{font-size:19px}
.goal{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:.5px solid var(--sep);font-size:15px}.goal:last-child{border-bottom:0}.goal i{font-style:normal;font-size:12px;font-weight:600;color:var(--mut);min-width:78px;padding-top:2px}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}.msg{max-width:84%;padding:9px 13px;border-radius:18px;font-size:16px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;animation:rise .3s both}
.msg.a{background:var(--card);align-self:flex-start;border-bottom-left-radius:6px}.msg.u{background:var(--acc);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}.msg img{max-width:100%;border-radius:10px;display:block;margin-top:6px}
.qr{display:flex;flex-wrap:wrap;gap:6px}.qr button{border:1px solid var(--acc);background:none;color:var(--acc);border-radius:99px;padding:0 12px;min-height:36px;font:500 15px -apple-system,system-ui,sans-serif;cursor:pointer}
.composer{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:8px 0}
.composer textarea{flex:1;font:16px -apple-system,system-ui,sans-serif;border:.5px solid var(--sep);background:var(--card);color:var(--ink);border-radius:20px;padding:10px 14px;resize:none;max-height:120px;min-height:44px}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--acc);color:#fff;cursor:pointer;flex:none;display:grid;place-items:center}.send svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--gray);animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes bl{50%{opacity:.3}}
.media{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.media img,.media video{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--fill)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}.seg button{border:0;background:none;font:500 14px -apple-system,system-ui,sans-serif;color:var(--ink);padding:6px 4px;border-radius:7px;min-height:34px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
input[type=range]{width:100%;accent-color:var(--acc);min-height:34px}
.f{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:50px;position:relative}.f+.f::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.f label{flex:none;max-width:58%}.f input,.f select{flex:1;border:0;background:none;font:17px -apple-system,system-ui,sans-serif;color:var(--ink);text-align:right;min-height:46px;padding:0;width:100%}.f select{direction:rtl}
textarea.note{width:100%;font:16px -apple-system,system-ui,sans-serif;border:0;background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;min-height:86px;resize:vertical}
.hint{font-size:13px;color:var(--mut);margin:6px 16px 0}.txt{font-size:16px;line-height:1.5}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}.tabs a{display:grid;justify-items:center;gap:2px;padding:7px 0 6px;color:var(--mut);text-decoration:none;font-size:11px;font-weight:500;min-height:52px}.tabs a.on{color:var(--acc)}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}.tabs a.on svg{transform:scale(1.08)}
.sheet{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fade .25s both}@keyframes fade{from{opacity:0}}
.panel{position:relative;width:min(100%,480px);max-height:94vh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:0 16px calc(30px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(100%)}}
.nb{position:sticky;top:0;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 0 10px;z-index:1}.nb b{font-size:17px;font-weight:600;text-align:center}
.nb button{background:none;border:0;color:var(--acc);font:17px -apple-system,system-ui,sans-serif;min-height:44px;cursor:pointer;padding:0}.nb button:last-child{text-align:right;font-weight:600}.nb button:first-child{text-align:left}
#toast{white-space:nowrap;position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(30,30,32,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:10;max-width:90vw;display:flex;gap:14px;align-items:center}#toast.on{opacity:1}#toast.on.u{pointer-events:auto}
#toast button{background:none;border:0;color:#ff6482;font:600 15px -apple-system,system-ui,sans-serif;cursor:pointer;padding:4px 0;min-height:32px}
.empty{text-align:center;padding:32px 20px;display:grid;gap:12px;justify-items:center}.empty svg{width:110px;height:110px}
/* animazioni d'ingresso */

   try{await apiCall('Rispondi solo: ok',{max:5});KEYMSG='<span class="ok">✓ Funziona.</span> Chiave salvata solo su questo telefono.';render()}catch(x){$('#keyst').textContent=ERR[x&&x.code]||'Non funziona: controlla la chiave e il credito'}},
  delkey:()=>{try{localStorage.removeItem(KK)}catch(x){}KEYMSG='';render()},
  export:async()=>{const data=JSON.stringify(S),name='forma-backup-'+iso(today())+'.json';try{if(IN_CLAUDE){const dl=await claude.use('downloads');if(!dl){toast('Download non disponibile qui');return}await dl.save({filename:name,data});toast('Backup scaricato');return}
   const f=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Backup Forma'});return}dlBlob(f,name)}catch(err){if(err&&err.name!=='AbortError')toast('Esportazione non riuscita')}},
  imp:()=>$('#impIn').click(),
  doimp:()=>{S=Object.assign(DEF(),IMP);fixS();S.active=null;IMP=null;save();closeSh();location.hash='#oggi';render();toast('Dati importati')}};
 if(O[a])O[a]()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.set){const[ei,si,k]=t.dataset.set.split('.');S.active.esercizi[+ei].sets[+si][k]=t.value;save()}
 else if(t.dataset.run){S.active.corsa[t.dataset.run]=t.value;const p=$('#c-p');if(p)p.textContent=pace(num(S.active.corsa.km),parseTime(S.active.corsa.t))||'—';save()}
 else if(t.id==='rpe')$('#rpev').textContent=t.value+'/10';else if(t.id==='snote'&&S.active){S.active.note=t.value;save()}else if(t.id==='msg'){t.style.height='auto';t.style.height=Math.min(120,t.scrollHeight)+'px'}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='mediaIn'&&t.files[0]){handleMedia(t.files[0]);t.value=''}else if(t.id==='ora'&&t.value){S.set.ora=t.value;save();openSh(shCal)}
 else if(t.id==='impIn'&&t.files[0]){const f=t.files[0];t.value='';f.text().then(x=>{const X=JSON.parse(x);if(!X||!Array.isArray(X.sessions))throw 0;IMP=X;openSh(shImp)}).catch(()=>toast('File non valido'))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSh();if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='msg'){e.preventDefault();($('[data-act=onbsend]')||$('[data-act=csend]')).click()}});
/* scorri il calendario col dito per cambiare mese */
let sx=null,sy=0;document.addEventListener('touchstart',e=>{const c=e.target.closest('.cgrid');sx=c?e.touches[0].clientX:null;sy=c?e.touches[0].clientY:0},{passive:true});
document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)goMonth(dx<0?1:-1)},{passive:true});
addEventListener('hashchange',()=>{closeSh();if(location.hash!=='#oggi'&&location.hash!=='#coach')S.ui.inSession=false;KEYMSG='';scrollTo(0,0);render()});
render();
if(!IN_CLAUDE&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
