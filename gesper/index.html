<style>
:root{
  --navy:#1F3864; --blue:#2F5597; --head:#D9E1F2; --input:#FFF8DC; --line:#C9CED6;
  --red:#C00000; --redbg:#F8CBAD; --green:#2E7D32; --greenbg:#C6EFCE; --grey:#F2F2F2;
  --warn:#9C5700; --warnbg:#FFE699;
  --text:#1b1f24; --muted:#5f6670; --bg:#EEF1F5; --card:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
header{background:var(--navy);color:#fff;text-align:center;padding:14px 16px 0}

.gcredit{text-align:center;font-size:11px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
nav{margin-top:10px}
nav .nmain{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
nav .nmain button{background:var(--blue);color:#fff;border:0;padding:10px 14px;font-size:14px;font-weight:bold;cursor:pointer;border-radius:6px 6px 0 0}
nav .nmain button.on{background:var(--bg);color:var(--navy)}

nav .nsub .nlab{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.6;margin-right:2px}
nav .nsub button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:5px 12px;font-size:13px;font-weight:bold;cursor:pointer;border-radius:14px}
nav .nsub button:hover{background:rgba(255,255,255,.22)}

.bub{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}
main{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:12px}
.bk{font-size:12px;color:var(--muted);align-self:center}

.syncst.ok{color:var(--green)}.syncst.err{color:var(--red)}.syncst.busy,.syncst.ro{color:var(--muted)}
.who{font-size:12.5px;font-weight:bold;color:var(--navy);align-self:center;margin-left:6px}

.glogo{font-size:24px;font-weight:bold;letter-spacing:2px;color:var(--navy);text-align:center}
.gsub{color:var(--muted);text-align:center;font-size:13px;margin-bottom:18px}
.gbox .fld,.mbox .fld{margin-bottom:10px}
.gbtns{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.gbtns .btn{padding:10px}

.gdiag{margin-top:12px;font-size:12px;color:var(--muted)}.gdiag summary{cursor:pointer}.gdiag table{margin-top:6px;width:100%}.gdiag td{padding:3px 6px;font-size:12px}
.gmsg{color:var(--red);font-weight:bold;min-height:20px;margin-top:8px;font-size:13px}
.modal{display:none;position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:30;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:10px;max-width:460px;width:100%;padding:20px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
.chk input{width:18px;height:18px}

tr.selrow td{background:#EAF0FA}
.secT td,.secT th{text-align:center}

.lastmod{font-size:11.5px;color:var(--muted);margin-top:4px}
.ronote{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:8px 12px;font-weight:bold;font-size:13px;margin-bottom:12px}
.bk.late{color:var(--red);font-weight:bold}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
h2{color:var(--navy);font-size:17px;margin:0 0 10px}
h3{color:var(--navy);font-size:15px;margin:14px 0 8px}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 10px;line-height:1.45}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:center;vertical-align:middle}
th{background:var(--head);font-size:12.5px}
td.l,th.l{text-align:left}
tr.tot td{background:var(--grey);font-weight:bold}
tr.old td{opacity:.55}
tr.sep td{border-top:2px solid var(--navy)}
select.selok{background:var(--greenbg);color:var(--green);font-weight:bold}
select.selko{background:var(--redbg);color:var(--red);font-weight:bold}
select.subsel{font-weight:bold;color:var(--navy);min-width:130px}

input[type=number]{text-align:center}
.btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:5px;border:1px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer;font-weight:bold;white-space:nowrap}
.btn.pri{background:var(--blue);color:#fff}

.row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.sel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

.empty{color:var(--muted);font-style:italic;padding:6px 0}

.ok{background:var(--greenbg);color:var(--green)}
.warn{background:var(--warnbg);color:var(--warn)}
.ko{background:var(--redbg);color:var(--red)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;background:#fff}

.kpi span{font-size:12px;color:var(--muted)}
.kpi.k b{color:var(--red)} .kpi.w b{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld>span{font-size:12px;color:var(--muted);font-weight:bold}
.fld.wide{grid-column:1/-1}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--head)}
.pn{font-size:22px;font-weight:bold;color:var(--navy)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:8px;text-decoration:none;min-width:140px}
.chip span{font-size:12px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.shead h2{margin:0}
.filef{display:flex;gap:4px;align-items:center;min-width:240px}

.nowrap{white-space:nowrap}
table a{color:var(--navy);font-weight:bold}
.et input,.et textarea{min-width:120px}

.t-ok{color:var(--green)!important}.t-warn{color:var(--warn)!important}.t-ko,.t-miss{color:var(--red)!important}.t-nd{color:var(--muted)!important}.t-lic{color:#1F4E9A!important}
.bars{display:flex;flex-direction:column;gap:8px;margin:8px 0 6px;max-width:900px}
.brow{display:grid;grid-template-columns:minmax(120px,240px) 1fr 70px;gap:10px;align-items:center}
.brow .bl{font-size:13px;font-weight:bold;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bn{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.brow.tot .bl{color:var(--navy)}.brow.tot{border-top:1px solid var(--line);padding-top:8px}
.sbar{display:flex;gap:2px;height:18px;background:transparent}
.sbar .sg{display:block;min-width:3px;height:100%}
.sbar .sg:first-child{border-radius:0}.sbar .sg:last-child{border-radius:0 4px 4px 0}
.sg.ok,.sw.ok{background:#4E9A5F}.sg.warn,.sw.warn{background:#E0A82E}.sg.ko,.sw.ko{background:#C8442C}
.sg.miss,.sw.miss{background:repeating-linear-gradient(135deg,#C8442C 0 4px,#F2C3B8 4px 7px)}
.sg.nd,.sw.nd{background:#D5DAE1}.sg.lic,.sw.lic{background:#3B73C4}.sg.pres,.sw.pres{background:#C9D6EA}
.sbar .sg:hover{filter:brightness(.9)}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:4px 0}
.lgd span{display:flex;align-items:center;gap:5px}.lgd b{color:var(--text)}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px}
table.ro td{font-size:13px}
@media (max-width:700px){.kpis.k5{grid-template-columns:1fr 1fr}.brow{grid-template-columns:100px 1fr 50px}}
.qt tr.qu{cursor:pointer}
.qt th.pres{background:#DCE8FB;color:#1F4E9A}
.qt td:nth-child(2){min-width:300px;max-width:380px}
.qt tr.qp td{padding-top:3px;padding-bottom:3px}

.licline a{color:#1F4E9A;font-weight:bold;text-decoration:none}
.imp{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:12px;background:#F8FAFD}
.imp h3{margin-top:0}.imp ol{margin:0 0 8px;padding-left:20px}

.kpis.k7{grid-template-columns:repeat(8,1fr)}
.kpis.k7 .kpi span{display:flex;align-items:center;justify-content:center;gap:4px}
.sg.tc-pres,.sw.tc-pres{background:#C9D6EA}.sg.tc-lic,.sw.tc-lic{background:#2a78d6}.sg.tc-srv,.sw.tc-srv{background:#eb6834}.sg.tc-cor,.sw.tc-cor{background:#1baf7a}
.sg.tc-perm,.sw.tc-perm{background:#eda100}.sg.tc-conv,.sw.tc-conv{background:#e87ba4}.sg.tc-alt,.sw.tc-alt{background:#9AA3B0}
table.tt td.tn{font-weight:bold}table.tt tr.tot td{background:var(--grey);font-weight:bold}
tr.tgrp td{background:#F3F6FB;border-top:2px solid #B4C2DA}
.b.tcb{background:#E4ECF8;color:var(--navy)}
@media (max-width:900px){.kpis.k7{grid-template-columns:repeat(4,1fr)}}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin:8px 0;font-size:12.5px;color:var(--muted)}
.uchips{display:flex;flex-wrap:wrap;gap:8px}
.uchip{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px 5px 6px;cursor:pointer;font:inherit;font-size:13px}

.org{overflow-x:auto;padding:4px 0 16px;cursor:grab}.org.pan{cursor:grabbing;user-select:none}
.orgin{width:max-content;min-width:100%}
.org ul.vert{flex-direction:column;align-items:center}
.org ul.vert>li{padding:12px 0 0}
.org ul.vert>li::after{display:none}
.org ul.vert>li::before{display:block;border:0;border-left:2px solid #8A96A8;border-radius:0;width:0;height:12px;left:50%;right:auto;top:0}
.org ul.vert>li:first-child::before{height:12px}

function iso(d){return String(d.getFullYear()).padStart(4,"0")+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}

// aggiorna PEFO e Tiri creati con la versione precedente, conservando i dati già inseriti
function upgradeSheet(o,old,nw){
  nw.id=old.id;
  const isTiri=key(nw.name)==="tiri",used=new Set();
  const map={};
  old.fields.forEach(f=>{
    if(isTiri&&key(f.label)==="arma"){map[f.id]="ARMA";return}
    let t=nw.fields.find(x=>!used.has(x.id)&&x.id!==nw.group&&key(x.label)===key(f.label));
    if(!t&&["data","scadenza","file","nota"].includes(f.type))t=nw.fields.find(x=>!used.has(x.id)&&x.type===f.type);
    if(t){used.add(t.id);map[f.id]=t.id}
  });
  const mod=nw.fields.find(x=>key(x.label)==="modello");
  o.entries.forEach(e=>{
    if(e.sheetId!==old.id)return;const v={};
    Object.keys(e.v).forEach(fid=>{const val=e.v[fid];if(!val)return;
      if(map[fid]==="ARMA"){v[nw.group]=/92|pistol|beretta|glock/i.test(val)?"Pistola":/mg|mitragl|minimi/i.test(val)?"Mitragliatrice":"Fucile";if(mod)v[mod.id]=val}
      else if(map[fid])v[map[fid]]=val});
    e.v=v;
  });
  return nw;
}
function fix(o){
  o.units=o.units||[];o.people=o.people||[];o.entries=o.entries||[];o.sheets=o.sheets||[];o.pfields=o.pfields||[];
  if(!o.v||o.v<2){
    o.sheets=o.sheets.map(sh=>key(sh.name)==="pefo"&&!sh.subs?upgradeSheet(o,sh,defPefo()):key(sh.name)==="tiri"&&!sh.subs?upgradeSheet(o,sh,defTiri()):sh);
    o.v=2;o._upg=1;
  }
  o.sheets.forEach(s=>{if(!Array.isArray(s.subs))s.subs=[]});
  o.gradi=o.gradi||GRADI.slice();if(o.warn==null)o.warn=60;if(o.folder==null)o.folder="documenti";if(o.madre==null)o.madre="";
  o.people.forEach(p=>{p.v=p.v||{}});o.entries.forEach(e=>{e.v=e.v||{}});
  // i campi fissi dell'anagrafica devono esserci sempre
  [{id:"grado",label:"Grado",type:"grado",fixed:1},{id:"cognome",label:"Cognome",type:"testo",fixed:1},{id:"nome",label:"Nome",type:"testo",fixed:1},{id:"unita",label:"Unità",type:"unita",fixed:1}]
    .forEach((f,i)=>{if(!o.pfields.some(x=>x.id===f.id))o.pfields.splice(Math.min(i,o.pfields.length),0,f)});
  o.users=Array.isArray(o.users)?o.users:[];o.users.forEach(u=>{u.scope=u.scope||{all:false,units:[]};u.scope.units=u.scope.units||[];u.sec=u.sec||{};u.ext=u.ext||{all:true,units:[]};u.ext.units=u.ext.units||[];u.xsec=u.xsec||{}});
  o.meta=o.meta||{};o.del=o.del||{};
  o.ui=Object.assign({tab:"quadro",fUnit:"",q:"",fs:"all",sf:"kow",sel:"",paste:false,bopen:"",bulk:{}},o.ui||{});
  return o;
}
const UIKEY="mimmo.pers.xl.ui",SKEY="mimmo.pers.xl.sess";

// copia dei dati presenti su questo PC all'avvio: serve per creare o ripristinare un archivio anche dopo un'uscita

function cleanData(unitName,upName,num){

  const up=upName?U(upName,""):null,me=U(unitName,up?up.id:"",num===""?"":+num||"");

let saveT,IDX=null;
let EDITS=0,FORCE=false;
function save(){EDITS++;IDX=null;SCOPE=undefined;EXT=undefined;MEMO=null;dirty=true;clearTimeout(saveT);saveT=setTimeout(()=>{saveUI();if(ME_ID)sync(false);else dirty=false},600)}

// ================= ARCHIVIO CONDIVISO =================
// Tutti i dati stanno in un unico file .json nella cartella condivisa. Ogni modifica viene unita a quelle
// degli altri utenti record per record (vince la modifica più recente), poi il file viene riscritto.
const ARR=["units","pfields","sheets","people","entries","users"],CFG=["madre","warn","folder","gradi"];
let FH=null,RO=false,ME_ID=null,BASE=null,syncing=false,syncAgain=false,dirty=false,SYNC={c:"busy",t:""},SCOPE,lastAct=Date.now(),fails=0,lockUntil=0;
const APP="GE.S.PER.",APPL="Gestione Scadenze del Personale",VER="3.6",VERDATE="18/11/2026",CREDIT=`realizzato da MIMMO.MOTRA · versione ${VER} del ${VERDATE}`;
const JTYPES=[{description:"Archivio GE.S.PER.",accept:{"application/json":[".json"]}}];
const sigR=r=>JSON.stringify(r,(k,v)=>k==="_u"||k==="_by"?undefined:v);
const sobj=o=>JSON.stringify(Object.keys(o||{}).sort().map(k=>[k,o[k]]));
function dataOf(o){const d={v:o.v,rev:o.rev||0,lastBackup:o.lastBackup||"",meta:o.meta||{},del:o.del||{}};ARR.forEach(a=>d[a]=o[a]||[]);CFG.forEach(k=>d[k]=o[k]);return d}
function canon(o){return JSON.stringify(ARR.map(a=>o[a]||[]))+JSON.stringify(CFG.map(k=>o[k]))+sobj(o.meta)+sobj(o.del)+(o.lastBackup||"")}
function sigMap(o){const m=new Map();ARR.forEach(a=>{(o[a]||[]).forEach(r=>m.set(a+":"+r.id,sigR(r)));m.set("ord:"+a,(o[a]||[]).map(r=>r.id).join(","))});m.set("cfg",JSON.stringify(CFG.map(k=>o[k])));m.set("bk",o.lastBackup||"");return m}
function applyData(d){ARR.forEach(a=>S[a]=d[a]||[]);CFG.forEach(k=>S[k]=d[k]);S.meta=d.meta||{};S.del=d.del||{};S.v=d.v;S.rev=d.rev||0;S.lastBackup=d.lastBackup||"";IDX=null;SCOPE=undefined;EXT=undefined;MEMO=null}
// segna come modificati (con ora e autore) i record cambiati dall'ultimo salvataggio
function stamp(){
  if(!BASE)return 0;const now=Date.now(),by=me()?me().username:"";let n=0;
  const cur=sigMap(S),rec=new Map();ARR.forEach(a=>(S[a]||[]).forEach(r=>rec.set(a+":"+r.id,r)));
  cur.forEach((s,k)=>{if(BASE.get(k)===s)return;n++;if(rec.has(k)){const r=rec.get(k);r._u=now;r._by=by}else S.meta[k]={u:now,by}});
  BASE.forEach((s,k)=>{if(!cur.has(k)&&!k.startsWith("ord:")&&k!=="cfg"&&k!=="bk"){S.del[k]=now;n++}});
  BASE=cur;return n;
}
function merge(L,R){
  const out={v:Math.max(L.v||0,R.v||0),rev:R.rev||0,lastBackup:(L.lastBackup||"")>(R.lastBackup||"")?L.lastBackup:(R.lastBackup||"")};
  const del=Object.assign({},R.del);Object.keys(L.del||{}).forEach(k=>{if(!(del[k]>=L.del[k]))del[k]=L.del[k]});
  const mu=(o,k)=>((o.meta||{})[k]||{}).u||0,meta={};
  new Set([...Object.keys(L.meta||{}),...Object.keys(R.meta||{})]).forEach(k=>{meta[k]=mu(L,k)>mu(R,k)?L.meta[k]:R.meta[k]});
  const cs=mu(L,"cfg")>mu(R,"cfg")?L:R;CFG.forEach(k=>out[k]=cs[k]);
  ARR.forEach(a=>{
    const m=new Map();
    const put=r=>{const k=a+":"+r.id;if(del[k]&&del[k]>=(r._u||0))return;const ex=m.get(r.id);if(!ex||(r._u||0)>(ex._u||0))m.set(r.id,r)};
    (R[a]||[]).forEach(put);(L[a]||[]).forEach(put);
    const first=mu(L,"ord:"+a)>mu(R,"ord:"+a)?L:R,second=first===L?R:L,seen=new Set(),arr=[];
    [first,second].forEach(src=>(src[a]||[]).forEach(r=>{if(m.has(r.id)&&!seen.has(r.id)){seen.add(r.id);arr.push(m.get(r.id))}}));
    out[a]=arr;
  });
  out.meta=meta;out.del=del;return out;
}
let LASTMOD=0;
async function readArchive(file){
  const f=file||await FH.getFile();if(f.lastModified)LASTMOD=f.lastModified;
  const t=await f.text();let o;
  try{o=JSON.parse(t)}catch(e){throw new Error("il file non è un archivio valido")}
  if(!o||!Array.isArray(o.people)||!Array.isArray(o.users))throw new Error("il file non è un archivio di questo programma");
  return fix(o);
}
async function writeArchive(d){const w=await FH.createWritable();await w.write(JSON.stringify(d));await w.close()}
function hhmm(d){return pad(d.getHours())+":"+pad(d.getMinutes())}
function fmtDT(x){const d=new Date(x);return isNaN(d)?"":pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" "+hhmm(d)}
function setSync(c,t){SYNC={c,t};const e=$("#syncst");if(!e)return;if(IOS){e.className="ih-sync "+c;return}e.className="syncst "+c;e.textContent=t}
async function sync(poll){
  if(!FH||!ME_ID)return;
  if(syncing){syncAgain=true;return}
  const n=stamp();
  if(!poll&&!n){dirty=false;return}
  syncing=true;if(n)setSync("busy","Salvataggio…");const e0=EDITS;
  try{
    const file=await FH.getFile();
    const force=FORCE;FORCE=false;
    if(!n&&!force&&file.lastModified&&file.lastModified===LASTMOD){setSync(RO?"ro":"ok",(RO?"Sola lettura · aggiornato ":"✔ Aggiornato ")+hhmm(new Date()));return}
    const R=await readArchive(file),L=dataOf(S),before=canon(L),M=merge(L,R),cm=canon(M);
    if(cm!==canon(R)&&!RO){
      M.rev=(R.rev||0)+1;M.savedAt=new Date().toISOString();M.savedBy=me()?me().username:"";M.appVer=VER;
      try{await writeArchive(M);const f2=await FH.getFile();if(f2.lastModified)LASTMOD=f2.lastModified}catch(e){RO=true;LASTERR=e;toast("Non riesco a salvare sul file archivio ("+errIt(e)+"): lavori in sola lettura.")}
    }
    // modifiche fatte mentre si leggeva/scriveva il file: non vanno perse, si salvano al giro successivo
    if(EDITS!==e0){stamp();syncAgain=true;return}
    applyData(M);BASE=sigMap(S);dirty=false;
    setSync(RO?"ro":"ok",(RO?"Sola lettura · aggiornato ":"✔ Salvato ")+hhmm(new Date()));

// impaginazione su un solo foglio A4 (210×297, margini 10 mm → 190×277 mm)
const MM=96/25.4,RAPW=190*MM,RAPH=277*MM;
function fitRap(){
  const box=$("#rap");let best=null;
  box.classList.add("rapmeas");
  for(let lv=0;lv<3;lv++){
    box.innerHTML=`<div class="rin">${rapHtml(lv)}</div>`;const inn=box.firstChild;let z=1;
    for(let i=0;i<5;i++){inn.style.width=(RAPW/z)+"px";const hh=inn.scrollHeight;const nz=Math.min(1,RAPH/hh*.98);if(Math.abs(nz-z)<.005){z=nz;break}z=nz}
    inn.style.width=(RAPW/z)+"px";z=Math.min(z,RAPH/inn.scrollHeight*.98);
    best={lv,z};if(z>=.7||lv===2)break;
  }
  inn0(box,best.z);box.classList.remove("rapmeas");
}
function inn0(box,z){const inn=box.firstChild;inn.style.width=(RAPW/z)+"px";inn.style.zoom=z}
function printRap(){

// «1° Plotone della Compagnia Rifornimenti del Battaglione Logistico»
const FEM=/^(compagnia|batteria|sezione|squadra|brigata|divisione|unit[aà]|base|scuola|direzione|legione|stazione|cellula|segreteria|infermeria|officina|armeria|caserma|forza|aliquota|componente|task force|grande unit|regione|zona|area|banda|fanfara|centrale|sala|cucina|mensa)/i;
function prep(name){
  const n=norm(name),w=n.split(" ")[0]||"";
  if(w.length>1&&w===w.toUpperCase()&&/[A-Z]/.test(w))return "del "+n;
  if(/^[aeiouàèéìòù]/i.test(w))return "dell'"+n;
  if(/^(s[^aeiouàèéìòù]|z|gn|ps|pn|x|y)/i.test(w))return (FEM.test(n)?"della ":"dello ")+n;
  return (FEM.test(n)||/a$/i.test(w)?"della ":"del ")+n;
}
function unitLong(id){const a=[];let u=unit(id),g=0;while(u&&g++<20){a.push(u);u=unit(u.parentId)}if(!a.length)return "—";return (a[0].name||"")+a.slice(1).map(x=>" "+prep(x.name)).join("")}

// FOGLIO
function sheetData(sh){
  const ps=filtered(S.ui.fUnit).filter(p=>canRP(sh.id,p)),pids=new Set(ps.map(p=>p.id)),q=key(S.ui.q),fs=S.ui.fs||"all",per=isPer(sh);
  const curSet=new Set();ps.forEach(p=>current(sh,p.id).forEach(e=>curSet.add(e.id)));
  let es=S.entries.filter(e=>e.sheetId===sh.id&&pids.has(e.personId)).filter(e=>{
    if(fs==="all")return true;
    if(per){const c=entryStat(sh,e).c;return fs==="lic"?c==="lic":fs==="plan"?c==="plan":fs==="done"?c==="done":true}
    if(!curSet.has(e.id))return false;if(fs==="cur")return true;
    const c=entryStat(sh,e).c;return fs==="ko"?c==="ko":fs==="warn"?c==="warn":(c==="ko"||c==="warn");
  });
  if(q)es=es.filter(e=>key(pname(person(e.personId))+" "+Object.values(e.v).join(" ")).includes(q));
  const order=new Map(ps.map((p,i)=>[p.id,i]));
  es.sort((a,b)=>(order.get(a.personId)-order.get(b.personId))||(subOrder(sh,a)-subOrder(sh,b))||sortKey(sh,b).localeCompare(sortKey(sh,a)));
  const missing=[];
  ps.forEach(p=>blocks(sh,p).forEach(b=>{if(b.miss)missing.push({p,title:b.title})}));
  return {ps,es,missing};
}

function cellTxt(sh,e,f){

// righe del riepilogo: le unità del primo livello sotto l'unità di partenza
function sumRows(ps){
  const top=S.ui.fUnit&&unit(S.ui.fUnit)?[unit(S.ui.fUnit)]:S.units.filter(u=>inView(u.id)&&(!u.parentId||!unit(u.parentId)||!inView(u.parentId)));
  const rows=[];
  top.forEach(t=>{
    const kids=S.units.filter(x=>x.parentId===t.id&&x.id!==t.id&&inView(x.id));
    if(!kids.length){rows.push({name:t.name,id:t.id,list:ps.filter(p=>desc(t.id).includes(p.unitId))});return}
    const dir=ps.filter(p=>p.unitId===t.id);if(dir.length)rows.push({name:t.name+" (alle dirette dipendenze)",list:dir});
    kids.forEach(k=>{const ids=desc(k.id);rows.push({name:k.name,id:k.id,list:ps.filter(p=>ids.includes(p.unitId))})});
  });
  return rows.filter(r=>r.list.length);
}
// barra in pila: segmenti con 2px di stacco, estremità arrotondata, numero totale fuori dalla barra
function sbar(parts,total){

  return `<div class="sbar">${seg||`<i class="sg nd" style="flex:1" title="Nessun dato"></i>`}</div>`;
}

function catOf(b){if(!b||b.none)return "nd";if(b.miss)return "miss";if(b.st.c==="ko")return "ko";if(b.st.c==="warn")return "warn";if(b.st.c==="ok")return "ok";return "nd"}
function count(list,fn){const c={};CAT.forEach(x=>c[x.k]=0);list.forEach(p=>c[fn(p)]++);return CAT.map(x=>Object.assign({n:c[x.k]},x))}

// può modificare questo account?
function mayEdit(u){
  const m=me();if(!m||RO||!u)return false;if(m.admin)return true;
  if(!m.mgr||u.admin||u.mgr||u.id===m.id)return false;

function sections(){return [{id:"anag",name:"Anagrafica (dati personali)"}].concat(S.sheets.map(s=>({id:s.id,name:(s.icon?s.icon+" ":"")+s.name})))}
function scopeText(u){if(u.admin||u.scope.all)return "Tutte le unità";const n=(u.scope.units||[]).filter(unit).map(unitName);return n.length?n.join(", ")+" (e dipendenti)":"Nessuna"}

function secText(u){if(u.admin)return "Tutto (lettura e scrittura)";const sn=s=>s.name.replace(/ \(.*\)$/,"");
  const a=sections().filter(s=>u.sec[s.id]).map(s=>`${sn(s)}: ${u.sec[s.id]==="w"?"✏️ scrive":"👁 legge"}`);

// ---------- IMPORTAZIONE DA EXCEL (copia e incolla)
let IMP=null,IMPTXT="";
const URX=/reggimento|brigata|battaglione|gruppo|compagnia|batteria|squadrone|plotone|sezione|squadra|nucleo|ufficio|reparto|servizio|comando|articolazione|cellula|distaccamento|^unit[aà]/i;
function impDest(){if(isAdmin())return S.ui.fUnit&&unit(S.ui.fUnit)?S.ui.fUnit:"";return S.ui.fUnit&&inScope(S.ui.fUnit)?S.ui.fUnit:defUnit()}
function impParse(txt,destId,upd){
  const lines=String(txt||"").replace(/\r/g,"").split("\n").filter(l=>l.trim());
  if(!lines.length)return {err:"Non hai incollato niente."};
  const rows=lines.map(l=>l.split(/\t|;/).map(x=>x.trim().replace(/^"(.*)"$/,"$1")));
  const H=rows[0].map(key),pfl=S.pfields.filter(f=>!f.fixed);
  const known=x=>/^(grado|cognome|nome|nominativo|cognome e nome|militare|organico|previsti)/.test(x)||URX.test(x)||pfl.some(f=>key(f.label)===x);
  const head=H.filter(known).length>=2||H.some(x=>/^(cognome|nominativo|cognome e nome)$/.test(x));
  let map;
  if(head){rows.shift();map=H.map(x=>{
    if(/^grado/.test(x))return "grado";if(/^(nominativo|cognome e nome|militare)/.test(x))return "nomin";
    if(/^cognome/.test(x))return "cognome";if(/^nome/.test(x))return "nome";if(/^(organico|previst|forza)/.test(x))return "num";
    const f=pfl.find(f=>key(f.label)===x);if(f)return f;if(URX.test(x))return "unit";return null})}
  else{const n=rows[0].length;map=n>=3?["grado","cognome","nome"]:n===2?["cognome","nome"]:["nomin"]}
  if(!map.some(m=>m==="cognome"||m==="nomin"||m==="unit"))return {err:"Non trovo né i nominativi né le unità: controlla la riga dei titoli (es. Grado, Cognome, Nome, Compagnia, Plotone)."};
  const NU=[],P={newUnits:NU,add:[],upd:[],nums:[],errors:[],head};
  const allU=()=>S.units.concat(NU);
  const child=(pid,name)=>allU().find(u=>(u.parentId||"")===(pid||"")&&key(u.name)===key(name));
  const dest=unit(destId);
  function resolve(path){
    if(!path.length)return destId?{id:destId}:{err:"manca l'unità: scegli un'unità nel filtro in alto o aggiungi le colonne delle unità"};
    let cur=destId||"",i=0;
    if(dest&&key(path[0])===key(dest.name))i=1;
    else if(!child(cur,path[0])){const g=allU().filter(u=>key(u.name)===key(path[0])&&(NU.includes(u)||inView(u.id)));if(g.length===1){cur=g[0].id;i=1}}
    for(;i<path.length;i++){
      let c=child(cur,path[i]);
      if(!c){if(!admOK())return {err:`l'unità «${path[i]}» non esiste (solo l'amministratore può crearne di nuove)`};c={id:uid(),name:path[i],parentId:cur,num:""};NU.push(c)}
      cur=c.id;
    }
    if(!NU.some(u=>u.id===cur)&&!inScope(cur))return {err:`l'unità «${unitName(cur)}» non è di tua competenza`};
    return {id:cur};
  }
  const matF=S.pfields.find(f=>/matricola/i.test(f.label)),vp=VP(),seen=new Map();
  const findP=v=>{
    if(matF&&norm(v[matF.id])){const m=vp.filter(p=>key(p.v[matF.id])===key(v[matF.id]));if(m.length===1)return m[0]}
    const k2=key(v.cognome)+"|"+key(v.nome),m=vp.filter(p=>key(p.v.cognome)+"|"+key(p.v.nome)===k2);return m.length===1?m[0]:null;
  };
  rows.forEach((r,ri)=>{
    const rn=ri+(head?2:1),v={},path=[];let num=null,bad="";
    map.forEach((m,ci)=>{const val=(r[ci]||"").trim();if(!m||!val)return;
      if(m==="unit")path.push(val);
      else if(m==="num")num=parseInt(val,10);
      else if(m==="nomin"){const w=val.split(/\s+/),up=w.filter(x=>x.length>1&&x===x.toUpperCase()&&/[A-ZÀ-Ý]/.test(x));
        if(up.length&&up.length<w.length){v.cognome=up.join(" ");v.nome=w.filter(x=>!up.includes(x)).join(" ")}else{v.cognome=w[0];v.nome=w.slice(1).join(" ")}}
      else if(typeof m==="string")v[m]=val;
      else if(m.type==="data"||m.type==="scadenza"){const d=parseIt(val,true);if(d===null)bad=`data non valida «${val}» in ${m.label}`;else v[m.id]=d}
      else v[m.id]=val;
    });
    if(bad){P.errors.push(`Riga ${rn}: ${bad}`);return}
    if(!v.cognome&&!v.nome){
      if(!path.length)return;
      const res=resolve(path);if(res.err){P.errors.push(`Riga ${rn}: ${res.err}`);return}
      if(num!=null&&!isNaN(num)){if(admOK())P.nums.push({id:res.id,num});else P.errors.push(`Riga ${rn}: solo l'amministratore può cambiare l'organico previsto`)}
      return;
    }
    const k2=key(v.cognome)+"|"+key(v.nome)+(matF?"|"+key(v[matF.id]):"");
    if(seen.has(k2)){P.errors.push(`Riga ${rn}: ${v.cognome} ${v.nome||""} è ripetuto, tenuta solo la prima riga`);return}
    seen.set(k2,1);
    const ex=upd?findP(v):null;
    if(ex){
      if(!canWP(ex,"anag")){P.errors.push(`Riga ${rn}: ${pname(ex)} non è di tua competenza`);return}
      let uid2=null;if(path.length){const res=resolve(path);if(res.err){P.errors.push(`Riga ${rn}: ${res.err}`);return}uid2=res.id}
      P.upd.push({p:ex,v,unitId:uid2});
    }else{const res=resolve(path);if(res.err){P.errors.push(`Riga ${rn}: ${res.err}`);return}P.add.push({v,unitId:res.id})}
  });
  return P;
}
function impUnitName(id,P){const u=P.newUnits.find(x=>x.id===id);return u?u.name+" (nuova)":unitName(id)}
function impReport(P){
  if(P.err)return `<div class="ronote">${esc(P.err)}</div>`;

    ${P.nums.length?`<li><b>${P.nums.length}</b> organici previsti da impostare</li>`:""}

    ${P.add.length?`<p class="small">Esempi: ${esc(P.add.slice(0,3).map(a=>[a.v.grado,a.v.cognome,a.v.nome].filter(Boolean).join(" ")+" → "+impUnitName(a.unitId,P)).join(" · "))}</p>`:""}
    ${nothing?`<p class="t-ko"><b>Non c'è niente da importare.</b></p>`:""}</div>`;
}

    ${IMP?impReport(IMP):""}</div>`;

function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function cellVal(f,v){return (f.type==="data"||f.type==="scadenza")?fmtD(v):(v==null?"":v)}
function csvRows(){
  const st=sheet(S.ui.tab),sh=st&&canR(st.id)?st:null,base=p=>[p?p.v.grado||"":"",p?p.v.cognome||"":"",p?p.v.nome||"":"",p?unitLong(p.unitId):""];
  if(sh){
    const {es}=sheetData(sh);
    return {name:sh.name,rows:[["Grado","Cognome","Nome","Unità"].concat(sh.fields.map(f=>f.label),["Stato","Giorni"])].concat(es.map(e=>{
      const p=person(e.personId),cur=isCur(sh,e),s=entryStat(sh,e);
      return base(p).concat(sh.fields.map(f=>!applies(sh,f,e)?"":f.type==="esitoauto"?autoVal(sh,f,e):cellVal(f,e.v[f.id])),[cur?s.t:"Storico",cur&&s.n!=null?s.n:""])}))};
  }
  if(S.ui.tab==="pers"){
    const pf=PF();
    return {name:"anagrafica",rows:[pf.map(f=>f.label)].concat(filtered(S.ui.fUnit,S.ui.q).map(p=>pf.map(f=>f.type==="unita"?unitName(p.unitId):(!f.fixed&&!canRP("anag",p))?"":cellVal(f,p.v[f.id]))))};
  }
  if(S.ui.tab==="scad"){
    return {name:"scadenze",rows:[["Stato","Giorni","Grado","Cognome","Nome","Unità","Foglio","Voce","Scadenza","Documento"]].concat(scadItems().map(i=>
      [i.st.t,i.miss?"":(i.st.n==null?"":i.st.n)].concat(base(i.p).slice(0,3),[unitName(i.p.unitId),i.sh?i.sh.name:"Anagrafica",i.title,fmtD(i.scad),firstFile(i.sh,i.e)])))};
  }
  const cols=[];VS().forEach(sh=>{const ss=subsOf(sh);if(ss.length)ss.forEach((s,i)=>cols.push({sh,i,label:sh.name+" – "+s.name}));else cols.push({sh,label:sh.name})});
  return {name:"quadro",rows:[["Grado","Cognome","Nome","Unità"].concat(cols.map(c=>c.label),["Stato"])].concat(filtered(S.ui.fUnit).map(p=>
    base(p).concat(cols.map(c=>{
      if(!canRP(c.sh.id,p))return "";
      if(c.i!=null){const b=blocks(c.sh,p)[c.i];return b.miss||b.none||b.st.neg?cellOf(b):cellOf(b)+" ("+b.st.t+")"}
      const s=summary(c.sh,p);return s.miss?"MANCA":(s.scad?fmtD(s.scad)+" ("+s.t+")":s.label)}),[OVERALL[overall(p)]])))};
}

// ---------- eventi
// le operazioni su impostazioni, unità, fogli e account sono riservate all'amministratore
const ADM_ACT=new Set(["gotoimp","export","import","uadd","unew","umv","udel","pfadd","pfdel","pfmv","shadd","shdel","shmv","sfadd","sfdel","sfmv","subadd","subdel","orgedit","recover"]);
const ADM_IN=new Set(["set","uname","unum","gradi","pflabel","shname","shicon","shmonths","sflabel","subname","sfopt"]);
const ADM_CH=new Set(["uparent","pftype","sftype","shgroup","subreq","sfper","shreq"]);
Object.assign(ACT,ACC,GACT,IMPACT);Object.assign(IN,ACC_IN);Object.assign(CH,ACC_CH);
function callIN(k,t){if(!IN[k])return;if(!me())return;if(ADM_IN.has(k)&&!admOK())return;if(ACC_IN[k]&&!canMgr())return;IN[k](t)}
function callCH(k,t){if(!CH[k])return;if(!me())return;if((ADM_CH.has(k)&&!admOK())||(ACC_CH[k]&&!canMgr())){denied();return render()}CH[k](t)}
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-tab],[data-act]");if(!t||t.disabled)return;
  if(t.dataset.tab){ev.preventDefault();if(!me())return;if(t.dataset.tab==="scheda")S.ui.from=t.dataset.from||S.ui.from;else if(["quadro","tras","scad","pers","altro"].includes(t.dataset.tab))S.ui.from="";S.ui.tab=t.dataset.tab;S.ui.q="";S.ui.pg={};saveUI();render();window.scrollTo(0,0);return}
  const a=t.dataset.act,f=ACT[a];if(!f)return;
  if(t.tagName==="A")ev.preventDefault();
  if(!GACT[a]&&!me())return;
  if(ADM_ACT.has(a)&&!admOK())return denied();
  if(ACC[a]&&a!=="recover"&&!canMgr())return denied();
  f(t.dataset,t);
});
document.addEventListener("keydown",ev=>{
  lastAct=Date.now();
  if(ev.key!=="Enter"||ev.target.tagName!=="INPUT")return;
  const box=ev.target.closest(".gbox,.mbox");if(!box)return;
  ev.preventDefault();const b=box.querySelector(".btn.pri");if(b)b.click();
});
["mousedown","touchstart"].forEach(n=>document.addEventListener(n,()=>{lastAct=Date.now()},{passive:true}));
document.addEventListener("wheel",ev=>{if(!ev.ctrlKey)return;const w=ev.target.closest&&ev.target.closest("#orgwrap");if(!w)return;ev.preventDefault();orgZoom(ev.deltaY<0?"+":"-")},{passive:false});
let PAN=null;
document.addEventListener("mousedown",ev=>{const w=ev.target.closest&&ev.target.closest("#orgwrap");if(!w||ev.target.closest(".ubox")||ev.button!==0)return;PAN={w,x:ev.clientX,y:ev.clientY,l:w.scrollLeft,t:window.scrollY};w.classList.add("pan");ev.preventDefault()});
document.addEventListener("mousemove",ev=>{if(!PAN)return;PAN.w.scrollLeft=PAN.l-(ev.clientX-PAN.x);window.scrollTo(window.scrollX,PAN.t-(ev.clientY-PAN.y))});
document.addEventListener("mouseup",()=>{if(PAN){PAN.w.classList.remove("pan");PAN=null}});
// campi data gg/mm/aaaa
function dateFire(t,isoV){
  t.classList.remove("err");
  const pk=t.parentNode&&t.parentNode.querySelector(".dtp");if(pk)pk.value=isoV;
  const k=t.dataset.in;if(k)callIN(k,{dataset:t.dataset,value:isoV,type:"date"});
  else{const c=t.dataset.ch;if(c)callCH(c,{dataset:t.dataset,value:isoV,type:"date"})}
}
function dateTyping(t,ev){
  let v=t.value.replace(/[.\-]/g,"/").replace(/\/{2,}/g,"/");if(v!==t.value)t.value=v;
  const m=/^(\d{2})\/?(\d{0,2})\/?(\d*)$/.exec(v);
  if(m&&!(ev&&/^delete/.test(ev.inputType||""))&&(m[2].length===2||!m[3])){
    const g=v.replace(/\D/g,"").slice(0,8);
    v=g.length>2?g.slice(0,2)+"/"+g.slice(2,4)+(g.length>4?"/"+g.slice(4):""):g;
    if(g.length===2||g.length===4)v+="/";
    t.value=v;
  }
  const r=parseIt(v,false);
  if(r!==null)dateFire(t,r);
}
function dateDone(t){
  const v=t.value.trim();
  if(!v){dateFire(t,"");return}
  const r=parseIt(v,true);
  if(r===null){t.classList.add("err");toast("Data non valida: scrivi gg/mm/aaaa (es. 15/03/2026)");return}
  t.value=fmtD(r);dateFire(t,r);
}
document.addEventListener("input",ev=>{lastAct=Date.now();const t=ev.target;if(t.dataset&&t.dataset.dt){dateTyping(t,ev);return}if(t.classList&&t.classList.contains("dtp"))return;const k=t.dataset&&t.dataset.in;if(k)callIN(k,t)});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.dt){dateDone(t);return}
  if(t.classList&&t.classList.contains("dtp")){const tx=t.parentNode.querySelector("input.dt");if(tx){tx.value=fmtD(t.value);dateFire(tx,t.value||"")}return}
  const k=t.dataset&&t.dataset.ch;if(k)callCH(k,t)});
$("#fPick").addEventListener("change",ev=>{
  const file=ev.target.files[0];ev.target.value="";if(!file||!pickT)return;
  const folder=String(S.folder||"").trim().replace(/[\\\/]+$/,""),path=(folder?folder+"/":"")+file.name,t=pickT;pickT=null;
  if(t.kind==="e"){const e=S.entries.find(x=>x.id===t.id);if(e)e.v[t.f]=path}
  else if(t.kind==="p"){const p=person(t.id);if(p)p.v[t.f]=path}
  else if(t.kind==="b"){bulk(t.id).v[t.f]=path}
  save();render();toast(`Collegato: ${path}${folder?` — il file deve stare nella cartella «${folder}»`:""}`);
});
$("#fImport").addEventListener("change",ev=>{
  const file=ev.target.files[0];ev.target.value="";if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{const o=fix(JSON.parse(r.result));if(!o||!Array.isArray(o.people)||!Array.isArray(o.sheets))throw 0;
    if(!admOK())return denied();
    if(!o.users.length)o.users=S.users;   // backup di una versione senza account: si tengono gli account attuali
    if(!o.users.some(u=>u.id===ME_ID))return toast("Questo backup non contiene il tuo account: non lo carico per non chiuderti fuori");
    if(!confirm(`Caricare il backup? Sostituisce tutti i dati dell'archivio condiviso (${o.people.length} militari nel backup).`))return;
    // ogni record del backup diventa la versione più recente; ciò che non c'è nel backup viene cancellato
    const now=Date.now();ARR.forEach(a=>(o[a]||[]).forEach(x=>{x._u=now;x._by=me().username}));
    applyData(Object.assign(dataOf(o),{meta:S.meta,del:S.del}));
    const m=sigMap(S);BASE.forEach((s,k)=>{if(!m.has(k)&&!k.startsWith("ord:")&&k!=="cfg"&&k!=="bk")S.del[k]=now});
    ["ord:units","ord:pfields","ord:sheets","ord:people","ord:entries","ord:users","cfg"].forEach(k=>S.meta[k]={u:now,by:me().username});
    BASE=sigMap(S);dirty=true;FORCE=true;sync(true);render();toast("Backup caricato nell'archivio condiviso")}catch(e){toast("File non valido: scegli un backup .json di questo programma")}};
  r.readAsText(file);
});
window.addEventListener("beforeunload",ev=>{if(ME_ID&&(dirty||syncing)){ev.preventDefault();ev.returnValue="";if(!syncing)sync(false)}});
// aggiornamento automatico con le modifiche degli altri utenti e uscita dopo 30 minuti di inattività
setInterval(()=>{if(ME_ID&&!document.hidden)sync(true)},20000);
window.addEventListener("focus",()=>{if(ME_ID)sync(true)});
setInterval(()=>{if(ME_ID&&Date.now()-lastAct>30*60e3){if(dirty)sync(false);logout("Uscita automatica dopo 30 minuti di inattività.")}},60000);
// app installata (iPhone): file dell'app disponibili anche senza rete
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
// avvio
(async()=>{
  if(!window.isSecureContext||!(window.crypto&&crypto.subtle))return gate("nosupport");
  if(LOCALMODE()){let v=null;try{v=await lget("arch")}catch(e){}FH=v?localHandle(v):null;keepStorage()}
  else FH=await idbGet();
  if(!FH)return gate("start");
  const sid=(()=>{try{return sessionStorage.getItem(SKEY)}catch(e){return null}})();
  if(sid){try{
    if((await FH.queryPermission({mode:"readwrite"}))==="granted"){
      const R=await readArchive(),u=R.users.find(x=>x.id===sid&&x.active!==false&&!x.mustChange);
      if(u){RO=false;applyData(R);BASE=sigMap(S);ME_ID=u.id;enterApp();return}
    }
  }catch(e){}}
  gate("login");
})();
})();
