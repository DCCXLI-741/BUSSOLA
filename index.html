<!DOCTYPE html>
<html lang="it">
<head>

<style>
/* VOICE: minimal come le app di sistema dell'iPhone, numeri grandi, poche parole
   IDEA: la bussola del patrimonio: dove sei, dove arrivi, quanto prima se cambi rotta
   PICTURE: il grafico che scorri col dito, e il simulatore dove due curve si separano mentre muovi i cursori
   COLOUR+TYPE: colori di sistema iOS su sfondo raggruppato; font di sistema
   LAYOUT: titoli grandi, liste raggruppate, quattro schede in basso, fogli dal basso */
:root{color-scheme:light dark;--bg:light-dark(#f2f2f7,#000);--card:light-dark(#fff,#1c1c1e);--ink:light-dark(#000,#fff);--mut:light-dark(#6c6c70,#98989f);
--sep:light-dark(rgba(60,60,67,.18),rgba(84,84,88,.6));--fill:light-dark(#e5e5ea,#2c2c2e);--blue:light-dark(#007aff,#0a84ff);--green:light-dark(#34c759,#30d158);--orange:light-dark(#ff9500,#ff9f0a);--red:light-dark(#ff3b30,#ff453a);--gray:light-dark(#aeaeb2,#636366);--bar:light-dark(rgba(249,249,249,.88),rgba(22,22,24,.88))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow-x:clip;-webkit-font-smoothing:antialiased}
p{margin:0}.mut{color:var(--mut)}small{font-size:13px}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px 110px}
.top{display:flex;justify-content:flex-end;min-height:36px}.top button{background:none;border:0;color:var(--blue);font:inherit;padding:6px 0;min-height:44px;cursor:pointer}
h1{font-size:34px;font-weight:700;letter-spacing:.2px;margin:0 0 14px}h2{font-size:20px;font-weight:700;margin:26px 4px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}h2 small{font-weight:400;color:var(--mut);font-size:15px}h3{font-size:17px;font-weight:600;margin:0}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:48px;position:relative;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .t{flex:1}.row .t small{display:block;color:var(--mut);margin-top:1px}.row .v{text-align:right;white-space:nowrap;color:var(--mut)}.row .v b{color:var(--ink);font-weight:500}
.chev::after{content:"";width:8px;height:8px;border:solid var(--gray);border-width:2px 2px 0 0;transform:rotate(45deg);flex:none}
.chev.open::after{transform:rotate(135deg)}
.add{color:var(--blue)}.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.hero{padding:16px}.big{font-size:42px;font-weight:700;letter-spacing:-.5px;line-height:1.05}.sub{font-size:15px;color:var(--mut);margin-top:4px;min-height:20px}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--fill);margin:14px 0 10px;gap:2px}.split i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.legend div{display:flex;flex-direction:column}.legend span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}.legend b{font-size:17px;font-weight:600}
.status{display:flex;gap:10px;align-items:flex-start;padding:12px 16px}.status>i{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
.fig{position:relative;height:210px;margin:10px 0 0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tip{position:absolute;top:-4px;background:var(--card);border:.5px solid var(--sep);box-shadow:0 4px 16px rgba(0,0,0,.14);border-radius:10px;padding:6px 10px;font-size:13px;pointer-events:none;white-space:nowrap;z-index:2;line-height:1.35}
.tip b{font-size:15px}.chips{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.chips button{border:0;background:var(--fill);color:var(--ink);font:500 14px -apple-system,system-ui,sans-serif;border-radius:99px;padding:0 12px;min-height:34px;cursor:pointer}.chips button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prog{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin:8px 0 6px}.prog i{display:block;height:100%;background:var(--blue);border-radius:4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;font:500 14px -apple-system,system-ui,sans-serif;color:var(--ink);padding:6px 4px;border-radius:7px;min-height:34px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.sl{padding:12px 16px}.sl+.sl{border-top:.5px solid var(--sep)}.sl .ctl b{font-weight:600}.sl small{color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--blue);min-height:34px;margin:4px 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stats div{background:var(--card);border-radius:12px;padding:12px 14px}.stats b{display:block;font-size:20px;font-weight:700;margin-top:2px;white-space:nowrap}.stats small{color:var(--mut)}
.pos{color:var(--green)}.neg{color:var(--red)}.tag{font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--mut);margin-left:6px;vertical-align:1px}
.btn{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:12px;font:600 17px -apple-system,system-ui,sans-serif;min-height:50px;cursor:pointer;margin-top:12px}
.btn.sec{background:var(--card);color:var(--blue)}.btn.del{background:var(--card);color:var(--red)}
.foot{font-size:13px;color:var(--mut);margin:8px 16px 0}.hint{font-size:13px;color:var(--mut);margin:6px 16px 0}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--fill);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{display:grid;justify-items:center;gap:2px;padding:7px 0 6px;color:var(--mut);text-decoration:none;font-size:11px;font-weight:500;min-height:52px}.tabs a.on{color:var(--blue)}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.panel{position:relative;width:min(100%,480px);max-height:94vh;overflow:auto;background:var(--bg);border-radius:12px 12px 0 0;padding:0 16px 30px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:.5}}
.nb{position:sticky;top:0;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 0 10px;z-index:1}.nb b{font-size:17px;font-weight:600;text-align:center}
.nb button{background:none;border:0;color:var(--blue);font:17px -apple-system,system-ui,sans-serif;min-height:44px;cursor:pointer;padding:0}.nb button:last-child{text-align:right;font-weight:600}.nb button:first-child{text-align:left}
.f{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:48px;position:relative}.f+.f::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.f label{flex:none;max-width:58%}.f input,.f select{flex:1;border:0;background:none;font:17px -apple-system,system-ui,sans-serif;color:var(--ink);text-align:right;min-height:46px;padding:0;width:100%}
.f select{direction:rtl}.f input::placeholder{color:var(--mut)}.f a{color:var(--blue);font-size:13px;text-decoration:none;flex:none}
details summary{list-style:none;cursor:pointer;color:var(--blue);padding:14px 16px 4px;font-size:15px}details summary::-webkit-details-marker{display:none}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(30,30,32,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:10;max-width:90vw}#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:360px){.big{font-size:34px}.legend b{font-size:15px}.stats b{font-size:17px}}
</style>
</head>

<div class="app"><div class="top"><button data-act="settings">Impostazioni</button></div><main id="view"></main></div>
<nav class="tabs"><div id="tabs">

<div id="toast" role="status"></div>
<script>
{
/* ---------- dati ---------- */
const TIPI={etf:'ETF',fondo:'Fondo',azione:'Azione',obbl:'Obbligazione',altro:'Altro'};
const FCOL=['#ff9500','#007aff','#af52de','#ff2d55','#30b0c7','#5856d6','#34c759','#a2845e'];
const DEFF=()=>[{id:'casa',n:'Casa'},{id:'auto',n:'Auto'},{id:'abb',n:'Abbonamenti'},{id:'pers',n:'Persona e salute'},{id:'altro',n:'Altro'}];
const PRESETS=[['Tutto investito',{pct:100,cus:0,invNow:true}],['Aggressiva',{pct:70,cus:'3m'}],['Bilanciata',{pct:50,cus:'4m'}],['Prudente',{pct:30,cus:'6m'}]];
const KEY='bussola2';let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const DEF=()=>({v:3,ts:0,liq:{val:null,data:''},inv:[],inc:[],fix:[],altre:0,pac:[],plan:[],hist:[],checks:[],folders:DEFF(),set:{pct:70,cus:5000,sweep:true,resa:4,oriz:36,g1:100000,g1n:'Prossimo traguardo',g2:null,g2n:'Obiettivo finale',rng:60,vista:'m'}});
function norm(X){const d=DEF();X=Object.assign(d,X||{});X.set=Object.assign(DEF().set,X.set||{});X.liq=X.liq||{val:null,data:''};
 ['inv','inc','fix','pac','plan','hist','checks'].forEach(k=>{if(!Array.isArray(X[k]))X[k]=[]});if(!Array.isArray(X.folders)||!X.folders.length)X.folders=DEFF();
 X.fix.forEach(f=>{if(!X.folders.some(o=>o.id===f.f))f.f=guessFolder(f.n,X.folders)});return X}
function guessFolder(n,F){const s=String(n||'').toLowerCase(),has=id=>F.some(f=>f.id===id)?id:null;
 return(/affitt|condomin|luce|gas|bollett|internet|casa|acqua|tari/.test(s)&&has('casa'))||(/auto|assicuraz|bollo|benzin|carbur|tagliand|gomm|rca/.test(s)&&has('auto'))||(/netflix|spotify|abbonam|disney|prime|icloud|telefon|palestra/.test(s)&&has('abb'))||has('altro')||F[F.length-1].id}
S=norm(S);
let ref=null,cloud='local',wq=null,writing=false,sheetFn=null,SIM=null;const open={};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(ref){clearTimeout(wq);wq=setTimeout(push,700)}}
async function push(){if(!ref)return;if(writing){clearTimeout(wq);wq=setTimeout(push,500);return}writing=true;try{await ref.set(JSON.parse(JSON.stringify(S)));cloud='ok'}catch(e){cloud='err'}writing=false}
(async()=>{try{if(!window.claude||!claude.use)return;const u=await claude.use('user');const id=u&&await u.id();const db=await claude.use('db');if(!db||!id)return;
 ref=db.doc('data/users/'+id+'/bussola2');const snap=await Promise.race([ref.get(),new Promise((_,r)=>setTimeout(()=>r('t'),10000))]);cloud='ok';
 if(snap.exists){const R=snap.data();if(R&&(R.ts||0)>(S.ts||0)){S=norm(JSON.parse(JSON.stringify(R)));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}else if((S.ts||0)>((R&&R.ts)||0))push()}else if(S.ts)push()}catch(e){cloud=ref?'err':'local'}})();
/* ---------- utilità ---------- */
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const nowYM=()=>iso(today()).slice(0,7),addYM=(ym,k)=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mName=(ym,l)=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('it-IT',l?{month:'long',year:'numeric'}:{month:'short',year:'2-digit'})};
function eu(n,dec){n=+n||0;const s=Math.abs(n).toFixed(dec?2:0).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return(n<0?'−':'')+s.join(',')+' €'}
const kk=v=>Math.abs(v)>=1e6?(v/1e6).toFixed(2).replace('.',',')+' mln':Math.abs(v)>=1e4?Math.round(v/1000)+'k':Math.abs(v)>=1000?(v/1000).toFixed(1).replace('.',',')+'k':String(Math.round(v));
const num=v=>{let s=String(v??'').trim().replace(/[€\s]/g,'');if(!s)return NaN;if(/,\d+$/.test(s))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
const uid=()=>Math.random().toString(36).slice(2,9),pct=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(2).replace('.',',')+'%';
const dur=n=>(n>=12?Math.floor(n/12)+(n>=24?' anni':' anno'):'')+(n>=12&&n%12?' e ':'')+(n%12?n%12+(n%12===1?' mese':' mesi'):'')||'subito';
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)};
/* ---------- calcoli ---------- */
const val=x=>x.qty&&x.px?+x.qty*+x.px:+x.val||0,cost=x=>+x.cost||(x.qty&&x.pmc?+x.qty*+x.pmc:0);
const invTot=()=>S.inv.reduce((s,x)=>s+val(x),0),costTot=()=>S.inv.reduce((s,x)=>s+cost(x),0),liq=()=>+S.liq.val||0;
const incM=ym=>S.inc.filter(i=>!i.al||ym<=i.al).reduce((s,i)=>s+(+i.imp||0),0);
const fixM=()=>S.fix.reduce((s,f)=>s+(+f.imp||0)/(+f.freq||1),0),speseM=()=>fixM()+(+S.altre||0),pacM=()=>S.pac.reduce((s,p)=>s+(+p.imp||0),0);
const upcoming=(from,k)=>S.plan.filter(p=>p.mese>=from&&p.mese<=addYM(from,k)).reduce((s,p)=>s+(+p.imp||0),0);
const cusVal=c=>c==='3m'?Math.round(speseM()*3/500)*500:c==='4m'?Math.round(speseM()*4/500)*500:c==='6m'?Math.round(speseM()*6/500)*500:+c||0;
const params=()=>({pct:+S.set.pct,cus:+S.set.cus,resa:+S.set.resa,spese:speseM(),invNow:false,sweep:!!S.set.sweep});
function month(ym,P){P=P||params();const inc=incM(ym),sp=P.spese,rest=inc-sp,invB=rest>0?Math.round(rest*P.pct/100):0,pac=pacM(),inv=Math.max(invB,pac);return{inc,sp,rest,invB,pac,free:Math.max(0,invB-pac),inv,cont:rest-inv}}
function project(H,P){P=P||params();const r=(+P.resa||0)/1200,cur=nowYM();let L=liq(),I=invTot(),V=Math.max(costTot(),0)||I;const out=[];
 for(const p of S.plan)if(p.mese<=cur)L-=+p.imp;
 if(P.invNow){const x=Math.max(0,L-P.cus-upcoming(cur,6));L-=x;I+=x;V+=x}
 for(let i=1;i<=H;i++){const ym=addYM(cur,i),m=month(ym,P);for(const p of S.plan)if(p.mese===ym)L-=+p.imp;
  I=I*(1+r)+m.inv;V+=m.inv;L+=m.cont;if(P.sweep){const keep=P.cus+upcoming(addYM(ym,1),6);if(L>keep&&m.cont>0){const sw=Math.min(m.cont,L-keep);L-=sw;I+=sw;V+=sw}}
  out.push({ym,L,I,V})}return out}
function eta(t,P){if(!t)return null;if(invTot()>=t)return 0;const pr=project(600,P),i=pr.findIndex(p=>p.I>=t);return i<0?null:i+1}
function snap(){if(S.liq.val==null&&!S.inv.length)return;const d=iso(today());S.hist=S.hist.filter(h=>h.d!==d);S.hist.push({d,L:liq(),I:Math.round(invTot()*100)/100});S.hist.sort((a,b)=>a.d.localeCompare(b.d))}
function histM(){const m={};for(const h of S.hist)m[h.d.slice(0,7)]=h;return m}
function streak(){let n=0,ym=nowYM();if(!S.checks.some(c=>c.ym===ym))ym=addYM(ym,-1);while(S.checks.some(c=>c.ym===ym)){n++;ym=addYM(ym,-1)}return n}
function status(){const m=month(addYM(nowYM(),1)),P=project(+S.set.oriz||36);let mn=null;for(const p of P)if(!mn||p.L<mn.L)mn=p;
 if(S.liq.val==null)return['var(--orange)','Inserisci la liquidità del conto','Serve per sapere se il piano regge.'];
 if(!S.inc.length)return['var(--orange)','Aggiungi le tue entrate','Senza entrate Bussola non può dividere lo stipendio.'];
 if(m.rest<0)return['var(--red)','Le spese superano le entrate',`Ogni mese mancano ${eu(-m.rest)}.`];
 if(mn&&mn.L<0)return['var(--red)','Il conto va in negativo',`A ${mName(mn.ym,1)} arriveresti a ${eu(mn.L)}.`];
 if(m.pac>m.invB)return['var(--orange)','I PAC superano la quota investimento',`Investi ${eu(m.pac)} ma la strategia ne prevede ${eu(m.invB)}.`];
 const c=+S.set.cus;if(liq()>=c)return['var(--green)','Piano sostenibile','Il cuscinetto è pieno.'];const i=P.findIndex(p=>p.L>=c);
 return['var(--green)','Piano sostenibile',i<0?`Il cuscinetto di ${eu(c)} non si riempie entro ${P.length} mesi.`:`Il cuscinetto di ${eu(c)} sarà pieno a ${mName(P[i].ym,1)}.`]}
/* ---------- grafico interattivo ---------- */
const CH={};
function chart(id,cfg){const el=document.getElementById(id);if(!el)return;cfg.hover=null;CH[id]=cfg;drawC(id);
 if(el._b)return;el._b=1;let raf=0;
 const mv=e=>{const c=CH[id];if(!c||!c.n)return;const r=el.getBoundingClientRect(),x=e.clientX-r.left;let i=c.mode==='bars'?Math.floor(x/(r.width/c.n)):Math.round(x/r.width*(c.n-1));i=Math.max(0,Math.min(c.n-1,i));
  if(i!==c.hover){c.hover=i;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{drawC(id);c.onScrub&&c.onScrub(i)})}};
 const end=()=>{const c=CH[id];if(c&&c.hover!=null){c.hover=null;drawC(id);c.onScrub&&c.onScrub(null)}};
 el.addEventListener('pointerdown',mv);el.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)mv(e)});
 el.addEventListener('pointerleave',end);el.addEventListener('pointercancel',end);el.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')setTimeout(end,900)})}
function drawC(id){const c=CH[id],el=document.getElementById(id);if(!c||!el)return;const W=el.clientWidth,H=el.clientHeight;if(!W)return;const bot=H-20,top=8,h=c.hover;
 let all=[];if(c.mode==='bars')c.bars.forEach(b=>all.push(b.parts.reduce((s,p)=>s+p.v,0)));else c.series.forEach(s=>s.vals.forEach(v=>v!=null&&all.push(v)));

 <h2>Spese previste</h2><div class="list">${[...S.plan].sort((a,b)=>a.mese.localeCompare(b.mese)).map(p=>row('plan',p.id,esc(p.n),mName(p.mese,1),eu(p.imp))).join('')}<button class="row add" data-act="plan">Aggiungi spesa prevista</button></div>
 <h2>Conto</h2><div class="list">${row('liq','','Liquidità',S.liq.data?'aggiornata al '+new Date(S.liq.data+'T00:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'}):'da inserire',S.liq.val==null?'—':eu(S.liq.val))}${row('cus','','Cuscinetto','quanto tieni fermo',eu(S.set.cus))}
 <label class="row" style="cursor:pointer"><span class="t">Spostamento automatico<small>a cuscinetto pieno, la contingenza va investita</small></span><input type="checkbox" id="sweep" ${S.set.sweep?'checked':''} style="width:22px;height:22px;accent-color:var(--green)"></label></div>
 <h2>Obiettivi</h2><div class="list">${row('goal','1',esc(S.set.g1n),'investiti',S.set.g1?eu(S.set.g1):'—')}${row('goal','2',esc(S.set.g2n),'investiti',S.set.g2?eu(S.set.g2):'—')}</div>`}
/* ---------- investimenti ---------- */
function vInv(){const T=invTot(),C=costTot(),G=T-C,by={};S.inv.forEach(x=>by[x.tipo]=(by[x.tipo]||0)+val(x));const last=S.inv.reduce((m,x)=>x.agg&&x.agg>m?x.agg:m,''),age=last?Math.round((today()-new Date(last+'T00:00:00'))/864e5):null;
 const hp=S.hist.filter(h=>h.I>0);
 return`<h1>Investimenti</h1><div class="list hero"><small class="mut">Valore</small><p class="big" id="ibig">${eu(T)}</p><p class="sub" id="isub"><span class="${G>=0?'pos':'neg'}">${G>=0?'+':''}${eu(G,1)}${C?' ('+pct(G/C*100)+')':''}</span> rispetto a quanto hai versato</p>
 ${hp.length>1?'<div class="fig" id="chI" style="height:150px"></div>':''}
 <div class="split" aria-hidden="true">${Object.entries(by).map(([k,v],i)=>`<i style="flex:${v};background:${FCOL[(i+1)%FCOL.length]}"></i>`).join('')}</div>
 <div style="display:flex;flex-wrap:wrap;gap:4px 14px">${Object.entries(by).map(([k,v],i)=>`<span style="font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px"><i class="dot" style="background:${FCOL[(i+1)%FCOL.length]}"></i>${TIPI[k]} ${T?Math.round(v/T*100):0}%</span>`).join('')}</div>
 <button class="btn" data-act="prices">Aggiorna i prezzi</button>${age!=null?`<p class="hint" style="margin:8px 0 0;text-align:center">${age===0?'Aggiornati oggi':age===1?'Aggiornati ieri':`Ultimo aggiornamento ${age} giorni fa`}</p>`:''}</div>
 <h2>Posizioni</h2><div class="list">${S.inv.map(x=>{const g=val(x)-cost(x),c=cost(x);return`<button class="row chev" data-act="pos" data-id="${x.id}"><span class="t">${esc(x.n)}<span class="tag">${TIPI[x.tipo]}</span><small>${S.pac.some(p=>p.pos===x.id)?'PAC · ':''}${c?'versati '+eu(c):''}</small></span><span class="v"><b>${eu(val(x))}</b><br><small class="${g>=0?'pos':'neg'}">${c?pct(g/c*100):''}</small></span></button>`}).join('')}<button class="row add" data-act="pos">Aggiungi investimento</button></div>
 <p class="foot">Bussola tiene il conto e fa stime: non dà consigli d’investimento.</p>`}
function invChart(){const hp=S.hist.filter(h=>h.I>0);if(hp.length<2||!$('#chI'))return;const labels=hp.map(h=>h.d.slice(0,7)),v=hp.map(h=>h.I);
 chart('chI',{labels,split:-1,label:'Valore investimenti nel tempo',series:[{vals:v,color:'var(--blue)',fill:1}],tip:i=>`<span class="mut">${new Date(hp[i].d+'T00:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</span><br><b>${eu(v[i])}</b>`,
  onScrub:i=>{const b=$('#ibig');if(b)b.textContent=eu(i==null?invTot():v[i])}})}
const V={riepilogo:vRie,strategia:vStrat,spese:vSpese,investimenti:vInv};
function render(){const h=location.hash.slice(1),k=V[h]?h:'riepilogo';document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+k));
 Object.keys(CH).forEach(x=>delete CH[x]);$('#view').innerHTML=V[k]();if(k==='riepilogo')mainChart();if(k==='strategia')updSim();if(k==='investimenti')invChart()}
/* ---------- fogli ---------- */
function openSh(fn){sheetFn=fn;$('#sc').innerHTML=fn();$('#sheet').hidden=false;$('#sc').scrollTop=0;const f=$('#sc input');if(f&&matchMedia('(hover:hover)').matches)f.focus()}
function closeSh(){sheetFn=null;$('#sheet').hidden=true}
const nb=(t,act,id,extra)=>`<div class="nb"><button data-act="close">Annulla</button><b>${t}</b><button data-act="${act}" ${id?`data-id="${id}"`:''} ${extra||''}>Fine</button></div>`;
const fld=(id,lab,v,ph,type)=>`<div class="f"><label for="${id}">${lab}</label><input id="${id}" ${type==='month'?'type="month"':type==='text'?'':'inputmode="decimal"'} value="${esc(v??'')}" placeholder="${esc(ph||'')}"></div>`;
const del=(act,id)=>id?`<button class="btn del" data-act="${act}" data-id="${id}">Elimina</button>`:'';
const n2=v=>v==null||v===''?'':String(Math.round(v*100000)/100000).replace('.',',');
const fOpts=sel=>S.folders.map(f=>`<option value="${f.id}" ${f.id===sel?'selected':''}>${esc(f.n)}</option>`).join('');
const shInc=id=>()=>{const x=id?S.inc.find(y=>y.id===id):{};return nb(id?'Entrata':'Nuova entrata','sinc',id)+`<div class="list">${fld('e-n','Nome',x.n,'Stipendio','text')}${fld('e-i','Al mese €',n2(x.imp),'2000')}${fld('e-al','Fino a',x.al,'','month')}</div><p class="hint">Lascia vuoto "Fino a" se non finisce.</p>${del('dinc',id)}`};
const shFix=(id,fo)=>()=>{const x=id?S.fix.find(y=>y.id===id):{freq:1,f:fo||'altro'};return nb(id?'Spesa':'Nuova spesa','sfix',id)+`<div class="list">${fld('f-n','Nome',x.n,'Affitto','text')}${fld('f-i','Importo €',n2(x.imp),'630')}<div class="f"><label for="f-q">Ogni</label><select id="f-q"><option value="1" ${+x.freq!==12?'selected':''}>mese</option><option value="12" ${+x.freq===12?'selected':''}>anno</option></select></div><div class="f"><label for="f-f">Cartella</label><select id="f-f">${fOpts(x.f)}</select></div></div><p class="hint">Le spese annuali vengono divise per 12.</p>${del('dfix',id)}`};
const shFolder=id=>()=>{const x=id?S.folders.find(f=>f.id===id):{};return nb(id?'Cartella':'Nuova cartella','sfold',id)+`<div class="list">${fld('fo-n','Nome',x.n,'es. Viaggi','text')}</div>${id&&S.folders.length>1?`<button class="btn del" data-act="dfold" data-id="${id}">Elimina cartella</button><p class="hint">Le spese dentro finiscono in un’altra cartella, non vengono cancellate.</p>`:''}`};
const shAltre=()=>nb('Altre spese','saltre')+`<div class="list">${fld('a-i','Al mese €',n2(S.altre),'500')}</div><p class="hint">Tutto quello che non è fisso: spesa, benzina, uscite.</p>`;
const shPac=id=>()=>{const x=id?S.pac.find(y=>y.id===id):{};return nb(id?'PAC':'Nuovo PAC','spac',id)+`<div class="list">${fld('p-n','Nome',x.n,'Fineco AM Passive','text')}${fld('p-i','Al mese €',n2(x.imp),'500')}${fld('p-g','Giorno',x.g,'3')}<div class="f"><label for="p-pos">Su</label><select id="p-pos"><option value="">—</option>${S.inv.map(i=>`<option value="${i.id}" ${x.pos===i.id?'selected':''}>${esc(i.n)}</option>`).join('')}</select></div></div>${del('dpac',id)}`};
const shPlan=id=>()=>{const x=id?S.plan.find(y=>y.id===id):{mese:addYM(nowYM(),2)};return nb(id?'Spesa prevista':'Nuova spesa prevista','splan',id)+`<div class="list">${fld('s-n','Nome',x.n,'Caparra affitto','text')}${fld('s-i','Importo €',n2(x.imp),'1100')}${fld('s-m','Mese',x.mese,'','month')}</div>${del('dplan',id)}`};
const shLiq=()=>nb('Liquidità','sliq')+`<div class="list">${fld('l-v','Sul conto oggi €',n2(S.liq.val),'5000')}</div><p class="hint">Copiala dal saldo del conto.</p>`;
const shCus=()=>nb('Cuscinetto','scus')+`<div class="list">${fld('c-v','Tengo fermi €',n2(S.set.cus),'5000')}</div><p class="hint">Spesso si tengono da 3 a 6 mesi di spese: per te ${eu(speseM()*3)}–${eu(speseM()*6)}.</p>`;
const shGoal=k=>()=>nb('Obiettivo','sgoal',k)+`<div class="list">${fld('g-n','Nome',S.set['g'+k+'n'],'Prossimo traguardo','text')}${fld('g-t','Investiti €',n2(S.set['g'+k]),'100000')}</div>`;
const gl=x=>x.isin?`<a href="https://www.google.com/search?q=${encodeURIComponent(x.isin+' prezzo')}" target="_blank" rel="noopener">cerca</a>`:'';
function shPos(id){return()=>{const x=id?S.inv.find(y=>y.id===id):{tipo:'etf'};return nb(id?'Investimento':'Nuovo investimento','spos',id)+`<div class="list">${fld('i-n','Nome',x.n,'ETF azionario mondo','text')}<div class="f"><label for="i-t">Tipo</label><select id="i-t">${Object.entries(TIPI).map(([k,v])=>`<option value="${k}" ${x.tipo===k?'selected':''}>${v}</option>`).join('')}</select></div>${fld('i-v','Valore attuale €',n2(x.qty&&x.px?'':x.val),x.qty&&x.px?eu(val(x),1)+' (da quote)':'10000')}${fld('i-c','Versati €',n2(x.cost),'9500')}</div>
 <details ${x.qty?'open':''}><summary>Quote e prezzi (facoltativo)</summary><div class="list">${fld('i-q','Quote',n2(x.qty),'40')}${fld('i-pm','Prezzo medio',n2(x.pmc),'124,33')}${fld('i-px','Prezzo attuale',n2(x.px),'132,61')}${fld('i-isin','ISIN',x.isin,'','text')}</div></details>${del('dpos',id)}`}}
const shPrices=()=>nb('Aggiorna i prezzi','sprices')+`<div class="list">${S.inv.map(x=>`<div class="f"><label for="pr-${x.id}" style="max-width:62%;font-size:15px">${esc(x.n)}<br><small class="mut">${x.qty&&x.px?'prezzo per quota':'valore totale €'}</small> ${gl(x)}</label><input id="pr-${x.id}" inputmode="decimal" value="${n2(x.qty&&x.px?x.px:x.val)}"></div>`).join('')}</div><p class="hint">Copia i prezzi dall’app Fineco (P. mercato). "cerca" apre la ricerca dell’ISIN.</p>`;
const shCheck=()=>{const m=month(addYM(nowYM(),1));return nb('Chiudi il mese','scheck')+`<p class="hint" style="margin:0 16px 10px">Due minuti: aggiorni i numeri e vedi come è andata.</p><div class="list">${fld('k-l','Sul conto oggi €',n2(S.liq.val),'5000')}${fld('k-i','Investito questo mese €',n2(m.inv),String(m.inv))}</div>
 <button class="btn sec" data-act="prices2">Aggiorna anche i prezzi</button>`};
function shSet(){const st=window.claude?(cloud==='ok'?'Dati salvati nel tuo account.':'Dati salvati su questo dispositivo.'):'I dati restano solo su questo iPhone. Fai un backup ogni tanto.';
 return`<div class="nb"><span></span><b>Impostazioni</b><button data-act="sset">Fine</button></div><div class="list">${fld('x-r','Rendimento stimato %',n2(S.set.resa),'4')}</div>
 <p class="hint">${st}</p><div class="list" style="margin-top:20px"><button class="row add" data-act="export">Scarica backup</button><label class="row add" for="bk" style="cursor:pointer">Carica backup</label></div><input id="bk" type="file" accept=".json" hidden>
 <p class="hint">Bussola v2.0 · Strumento di calcolo personale, non consulenza finanziaria.</p>`}
/* ---------- azioni ---------- */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,g=s=>(($(s)||{}).value??'').trim(),n=s=>num(g(s));if(b.tagName==='A'&&b.getAttribute('href')==='#')e.preventDefault();
 const O={close:closeSh,settings:()=>openSh(shSet),inc:()=>openSh(shInc(id)),fix:()=>openSh(shFix(id,b.dataset.f)),altre:()=>openSh(shAltre),pac:()=>openSh(shPac(id)),plan:()=>openSh(shPlan(id)),liq:()=>openSh(shLiq),cus:()=>openSh(shCus),goal:()=>openSh(shGoal(id)),pos:()=>openSh(shPos(id)),
  prices:()=>openSh(shPrices),check:()=>openSh(shCheck),folder:()=>openSh(shFolder(id)),go:()=>{location.hash='#'+b.dataset.h},
  tfold:()=>{open[id]=!open[id];render()},vista:()=>{S.set.vista=b.dataset.v;save();render()},rng:()=>{S.set.rng=+b.dataset.v;save();render()},
  preset:()=>{const p=PRESETS[+b.dataset.i][1];SIM.pct=p.pct;SIM.cus=cusVal(p.cus);SIM.invNow=!!p.invNow;$('#rPct').value=SIM.pct;$('#rCus').value=SIM.cus;$('#rNow').checked=SIM.invNow;updSim()},
  simreset:()=>{SIM=null;render()},
  apply:()=>{S.set.pct=SIM.pct;S.set.cus=SIM.cus;S.set.resa=SIM.resa;const ds=SIM.spese-speseM(),now=SIM.invNow?Math.max(0,liq()-SIM.cus-upcoming(nowYM(),6)):0;if(Math.abs(ds)>=1)S.altre=Math.max(0,Math.round((+S.altre||0)+ds));save();SIM=null;render();toast(now>0?`Piano aggiornato. Ricordati di investire ${eu(now)} dal conto`:Math.abs(ds)>=1?'Piano aggiornato: ho corretto le altre spese':'Piano aggiornato')}};
 if(O[a]){O[a]();return}
 const up=(arr,o)=>{if(id)Object.assign(arr.find(x=>x.id===id),o);else arr.push({id:uid(),...o})},rm=k=>{S[k]=S[k].filter(x=>x.id!==id)};
 if(a==='sinc'){if(!(n('#e-i')>0)){toast('Scrivi l’importo');return}up(S.inc,{n:g('#e-n')||'Entrata',imp:n('#e-i'),al:g('#e-al')})}
 else if(a==='sfix'){if(!(n('#f-i')>0)){toast('Scrivi l’importo');return}up(S.fix,{n:g('#f-n')||'Spesa',imp:n('#f-i'),freq:+g('#f-q')||1,f:g('#f-f')});open[g('#f-f')]=true}
 else if(a==='sfold'){const nm=g('#fo-n');if(!nm){toast('Scrivi il nome');return}if(id)S.folders.find(f=>f.id===id).n=nm;else{const fid='f'+uid();S.folders.push({id:fid,n:nm});open[fid]=true}}
 else if(a==='dfold'){S.folders=S.folders.filter(f=>f.id!==id);const to=S.folders.find(f=>f.id==='altro')||S.folders[0];S.fix.forEach(x=>{if(x.f===id)x.f=to.id})}
 else if(a==='saltre'){S.altre=n('#a-i')||0}
 else if(a==='spac'){if(!(n('#p-i')>0)){toast('Scrivi l’importo');return}up(S.pac,{n:g('#p-n')||'PAC',imp:n('#p-i'),g:g('#p-g'),pos:g('#p-pos')})}
 else if(a==='splan'){if(!(n('#s-i')>0)){toast('Scrivi l’importo');return}up(S.plan,{n:g('#s-n')||'Spesa prevista',imp:n('#s-i'),mese:g('#s-m')||addYM(nowYM(),1)})}
 else if(a==='sliq'){const v=n('#l-v');S.liq={val:isNaN(v)?null:v,data:iso(today())};snap()}
 else if(a==='scus'){S.set.cus=n('#c-v')||0;SIM=null}
 else if(a==='sgoal'){S.set['g'+id+'n']=g('#g-n')||(id==='1'?'Prossimo traguardo':'Obiettivo finale');S.set['g'+id]=n('#g-t')||null}
 else if(a==='spos'){if(!g('#i-n')){toast('Scrivi il nome');return}const q=n('#i-q'),px=n('#i-px');up(S.inv,{n:g('#i-n'),tipo:g('#i-t'),val:isNaN(n('#i-v'))?(q&&px?q*px:0):n('#i-v'),cost:n('#i-c')||'',qty:q||'',pmc:n('#i-pm')||'',px:px||'',isin:g('#i-isin').toUpperCase(),agg:iso(today())});snap()}
 else if(a==='sprices'||a==='prices2'){if(a==='sprices'){const before=invTot();S.inv.forEach(x=>{const v=n('#pr-'+x.id);if(!isNaN(v)&&v>0){if(x.qty&&x.px)x.px=v;else x.val=v;x.agg=iso(today())}});snap();const d=invTot()-before;closeSh();save();render();toast(Math.abs(d)<1?'Prezzi aggiornati':`Prezzi aggiornati: ${sg(d)}`);return}
  const v=n('#k-l');if(!isNaN(v))S.liq={val:v,data:iso(today())};snap();save();openSh(shPrices);return}
 else if(a==='scheck'){const v=n('#k-l'),before=S.hist.length?S.hist[S.hist.length-1]:null;if(!isNaN(v))S.liq={val:v,data:iso(today())};const cur=nowYM();S.checks=S.checks.filter(c=>c.ym!==cur);S.checks.push({ym:cur,inv:n('#k-i')||0});snap();
  const now=liq()+invTot(),prev=before?before.L+before.I:null;closeSh();save();render();toast(prev!=null&&before.d<iso(today())?`Mese chiuso: patrimonio ${sg(now-prev)}`:`Mese chiuso · ${streak()} di fila`);return}
 else if(a==='sset'){S.set.resa=isNaN(n('#x-r'))?0:n('#x-r');SIM=null}
 else if(a==='dinc')rm('inc');else if(a==='dfix')rm('fix');else if(a==='dpac')rm('pac');else if(a==='dplan')rm('plan');else if(a==='dpos'){rm('inv');S.pac.forEach(p=>{if(p.pos===id)p.pos=''});snap()}
 else if(a==='export'){const name='bussola-backup-'+iso(today())+'.json',data=JSON.stringify(S,null,1);try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:name,data});toast('Backup scaricato');return}
  const f=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Backup Bussola'});return}const u=URL.createObjectURL(f),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(err){if(err&&err.name!=='AbortError'&&err.code!=='declined')toast('Backup non riuscito')}return}
 else return;closeSh();save();render()});
document.addEventListener('input',e=>{const t=e.target;if(!SIM||!t.id||!/^r(Pct|Cus|Sp|Re)$/.test(t.id))return;const k={rPct:'pct',rCus:'cus',rSp:'spese',rRe:'resa'}[t.id];SIM[k]=+t.value;updSim()});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='rNow'){SIM.invNow=t.checked;updSim()}
 else if(t.id==='sweep'){S.set.sweep=t.checked;SIM=null;save();render()}
 else if(t.id==='bk'&&t.files[0]){try{const X=JSON.parse(await t.files[0].text());if(!X||!Array.isArray(X.inv))throw 0;S=norm(X);snap();save();closeSh();render();toast('Backup caricato')}catch(err){toast('File non valido')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSh()});
addEventListener('hashchange',()=>{scrollTo(0,0);render()});
if(!S.hist.length&&(S.liq.val!=null||S.inv.length)){snap();save()}
render();if('serviceWorker' in navigator&&!window.claude)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
